name: Build & Release Koto

# ─── 触发条件 ───────────────────────────────────────────────────────────────
# 1. 推送版本标签（如 v1.2.0）→ 自动构建 + 创建 GitHub Release
# 2. 手动触发（workflow_dispatch） → 只构建 + 上传 artifact，不发布 Release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）。留空则读 VERSION 文件'
        required: false
        default: ''

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/tiptap-editor/package-lock.json
            web/univer-editor/package-lock.json

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.lock
          pip install pytest pytest-mock pytest-timeout pytest-playwright playwright pip-audit

      - name: Audit locked runtime dependencies
        run: pip-audit --requirement config/requirements.lock --desc

      - name: Install Chromium for browser regression
        run: python -m playwright install --with-deps chromium

      - name: Build and validate main frontend
        run: |
          npm ci --prefix web
          npm audit --prefix web --audit-level=high
          npm ci --prefix web/tiptap-editor
          npm audit --prefix web/tiptap-editor --audit-level=high
          npm ci --prefix web/univer-editor
          npm audit --prefix web/univer-editor --audit-level=high
          npm run lint --prefix web
          npm run typecheck --prefix web
          npm run build --prefix web
          npm run build --prefix web/tiptap-editor
          npm run build --prefix web/univer-editor

      - name: Run release source regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/unit/test_release_packaging_guards.py tests/unit/test_architecture_guardrails.py tests/unit/test_frontend_quality_config.py -q --tb=short
          python scripts/run_ai_assistant_flow_tests.py release -q --tb=short

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: Windows 桌面版构建（PyInstaller + Inno Setup）
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    needs: quality-gate
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/tiptap-editor/package-lock.json
            web/univer-editor/package-lock.json

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = (Get-Content VERSION -Raw -ErrorAction SilentlyContinue).Trim()
            if (-not $v) { $v = Get-Date -Format "yyyy.MM.dd" }
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building Koto version: $v"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('config/requirements.lock') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip wheel
          .\.venv\Scripts\pip install pyinstaller

          # Use lockfile for reproducible builds; excludes voice/gunicorn for packaging
          $lockContent = Get-Content config\requirements.lock
          $coreReqs = $lockContent | ForEach-Object {
            ($_ -split '#')[0].Trim()
          } | Where-Object {
            $_ -ne '' -and
            $_ -notmatch 'PyAudio' -and
            $_ -notmatch 'SpeechRecognition' -and
            $_ -notmatch 'vosk' -and
            $_ -notmatch 'edge.tts' -and
            $_ -notmatch 'sounddevice' -and
            $_ -notmatch 'faster.whisper' -and
            $_ -notmatch 'openai.whisper' -and
            $_ -notmatch 'gunicorn'
          }
          $coreReqs | Set-Content .venv\core_reqs.txt -Encoding ascii
          Write-Host "Installing $(($coreReqs | Measure-Object).Count) packages..."
          .\.venv\Scripts\pip install -r .venv\core_reqs.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install failed"; exit 1 }

          .\.venv\Scripts\pip install PyAudio
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::PyAudio install failed, voice will degrade at runtime"
          }
          Write-Host "Dependencies installed"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Main frontend npm ci failed"; exit 1 }
          npm ci --prefix web/tiptap-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::TipTap DOCX frontend npm ci failed"; exit 1 }
          npm ci --prefix web/univer-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Univer frontend npm ci failed"; exit 1 }

      - name: Build frontend assets
        shell: pwsh
        run: |
          npm run build --prefix web
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Main frontend build failed"; exit 1 }
          npm run build --prefix web/tiptap-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::TipTap DOCX frontend build failed"; exit 1 }
          npm run build --prefix web/univer-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Univer frontend build failed"; exit 1 }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $cmd = if ($env:ComSpec) { $env:ComSpec } else { "cmd.exe" }
          $pyinstaller = Join-Path $PWD ".venv\Scripts\pyinstaller.exe"
          $cmdLine = '"{0}" koto.spec --clean -y > "logs\build_latest.log" 2>&1' -f $pyinstaller
          & $cmd /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller build failed. Last 60 lines:"
            Get-Content logs\build_latest.log -Tail 60
            exit 1
          }
          $exeMB = [math]::Round((Get-Item dist\Koto\Koto.exe).Length / 1MB, 1)
          Write-Host "Build OK -> dist\Koto\Koto.exe ($exeMB MB)"

      - name: Smoke-test built EXE (file existence check)
        shell: pwsh
        run: |
          $internal = "dist\Koto\_internal"
          $staticRoot = Join-Path $internal "web\static"
          $configRoot = Join-Path $internal "config"
          $requiredConfigDirs = @("context", "divination_data", "skills", "skill_packs", "tools", "workflows")
          foreach ($dirName in $requiredConfigDirs) {
            $dirPath = Join-Path $configRoot $dirName
            if (-not (Test-Path $dirPath)) {
              New-Item -ItemType Directory -Path $dirPath -Force | Out-Null
              Write-Host "  NOTE: normalized empty config dir: $dirPath"
            }
          }
          $runtimeDefaults = @(
            @{ Name = "macro_suggestions.json"; Content = "{`"suggestions`": [], `"seen_fingerprints`": []}" },
            @{ Name = "personality_matrix.json"; Content = "{`"cognitive`": {`"exploratory`": 0.5, `"executor`": 0.5, `"analytical`": 0.5, `"creative`": 0.5}, `"expertise`": {}, `"goals`": [], `"recent_themes`": [], `"values`": {`"efficiency`": 0.5, `"depth`": 0.5, `"formality`": 0.5}, `"last_updated`": null}" }
          )
          foreach ($default in $runtimeDefaults) {
            $path = Join-Path $configRoot $default.Name
            if (-not (Test-Path $path)) {
              Set-Content -Path $path -Value $default.Content -Encoding UTF8
              Write-Host "  NOTE: seeded runtime default: $($default.Name)"
            }
          }
          $checks = @(
            "dist\Koto\Koto.exe",
            "$internal\base_library.zip",
            "$internal\psutil",
            "$internal\app",
            "$internal\web",
            "$internal\config",
            "$staticRoot\js\build\workspace-bundle.js",
            "$staticRoot\jszip.min.js",
            "$staticRoot\univer-dist\assets\sheets-main.js",
            "$staticRoot\univer-dist\assets\sheets-main.css",
            "$configRoot\.builtin_key",
            "$configRoot\deepseek_config.env.example",
            "$configRoot\macro_suggestions.json",
            "$configRoot\personality_matrix.json",
            "$configRoot\skill_affinity.json",
            "$configRoot\skill_bindings.json",
            "$configRoot\skill_ratings.json",
            "$configRoot\triggers.json",
            "$configRoot\context",
            "$configRoot\divination_data",
            "$configRoot\skills",
            "$configRoot\skill_packs",
            "$configRoot\tools",
            "$configRoot\workflows"
          )
          $failed = @()
          foreach ($p in $checks) {
            if (Test-Path $p) { Write-Host "  OK: $p" }
            else              { $failed += $p; Write-Host "::error::MISSING: $p" }
          }
          # Also verify psutil .pyd is present (the C extension that was missing in v1.0.2)
          $pyd = Get-ChildItem "$internal\psutil" -Filter "_psutil_windows*.pyd" -ErrorAction SilentlyContinue
          if ($pyd) { Write-Host "  OK: psutil C extension: $($pyd.Name)" }
          else       { $failed += "psutil/_psutil_windows.pyd"; Write-Host "::error::MISSING: psutil C extension .pyd" }

          $legacyIndex = Join-Path $staticRoot "univer-dist\index.html"
          if (Test-Path $legacyIndex) {
            $failed += $legacyIndex
            Write-Host "::error::UNEXPECTED legacy Univer index: $legacyIndex"
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::Smoke test failed: $($failed.Count) item(s) missing"
            exit 1
          }
          Write-Host "Smoke test passed: all critical bundle files present"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs\build_latest.log
          retention-days: 7

      - name: Build LocalModelInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $cmd = if ($env:ComSpec) { $env:ComSpec } else { "cmd.exe" }
          $pyinstaller = Join-Path $PWD ".venv\Scripts\pyinstaller.exe"
          $cmdLine = '"{0}" local_model_installer.spec --clean -y > "logs\local_model_installer_build_latest.log" 2>&1' -f $pyinstaller
          & $cmd /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::LocalModelInstaller build failed. Last 30 lines:"
            Get-Content logs\local_model_installer_build_latest.log -Tail 30
            exit 1
          }
          Write-Host "LocalModelInstaller OK -> dist\LocalModelInstaller.exe"

      - name: Upload LocalModelInstaller build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-installer-build-log
          path: logs\local_model_installer_build_latest.log
          retention-days: 7

      - name: Assemble portable bundle
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          .\scripts\prepare_webview2_runtime.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::WebView2 prerequisite preparation failed"; exit 1 }
          .\.venv\Scripts\python.exe src\deploy_portable.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::deploy_portable.py failed"; exit 1 }
          Write-Host "Portable bundle ready -> dist\Koto_Portable\"

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = (& .\scripts\resolve_inno_setup.ps1 -Quiet) | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (& .\scripts\resolve_inno_setup.ps1 -Quiet) | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path $iscc)) { Write-Host "::error::Inno Setup 6 not found"; exit 1 }
          & $iscc /DAppVersion=$env:VERSION koto_installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup build failed"; exit 1 }
          $setupName = "Koto_v$($env:VERSION)_Setup.exe"
          "SETUP_NAME=$setupName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sizeMB = [math]::Round((Get-Item "dist\$setupName").Length / 1MB, 1)
          Write-Host "Installer: $setupName ($sizeMB MB)"

      - name: Compress portable to zip
        shell: pwsh
        run: |
          $zipName = "Koto_v$($env:VERSION)_Windows.zip"
          Compress-Archive -Path "dist\Koto_Portable\*" -DestinationPath "dist\$zipName" -CompressionLevel Optimal
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sizeMB = [math]::Round((Get-Item "dist\$zipName").Length / 1MB, 1)
          Write-Host "Zip: $zipName ($sizeMB MB)"

      - name: Generate release manifest and SHA-256 checksums
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\write_release_manifest.py `
            --version $env:VERSION `
            --output "dist\Koto_v$($env:VERSION)_release-manifest.json" `
            --hash-output "dist\Koto_v$($env:VERSION)_SHA256SUMS.txt" `
            "dist\Koto_v$($env:VERSION)_Setup.exe" `
            "dist\Koto_v$($env:VERSION)_Windows.zip"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Release manifest generation failed"; exit 1 }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koto-windows
          path: |
            dist/Koto_v*_Setup.exe
            dist/Koto_v*_Windows.zip
            dist/Koto_v*_release-manifest.json
            dist/Koto_v*_SHA256SUMS.txt
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: Installer E2E Tests (blocks release on failure)
  # ══════════════════════════════════════════════════════════════════════════
  test-installer:
    name: Installer E2E Tests
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: koto-windows
          path: dist

      - name: Run installer E2E test
        shell: pwsh
        env:
          KOTO_SERVER_ONLY: "1"
        run: |
          $setup = Get-Item "dist\Koto_v*_Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::Setup EXE not found in dist\"; exit 1 }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          Write-Host "Testing installer: $($setup.FullName)"
          Write-Host "Using available loopback port: $port"
          & tests\installer\test_installer_e2e.ps1 `
            -SetupExe $setup.FullName `
            -TestInstallDir "$env:LOCALAPPDATA\KotoCI_E2E" `
            -Port $port `
            -HealthTimeoutSec 120
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run portable E2E test
        shell: pwsh
        env:
          KOTO_SERVER_ONLY: "1"
        run: |
          $zip = Get-Item "dist\Koto_v*_Windows.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "::error::ZIP not found; portable E2E is required for release"; exit 1 }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          Write-Host "Testing portable: $($zip.FullName)"
          Write-Host "Using available loopback port: $port"
          & tests\installer\test_portable_e2e.ps1 `
            -ZipFile $zip.FullName `
            -Port $port `
            -HealthTimeoutSec 120
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: Docker 镜像构建（推送到 GitHub Container Registry）
  # ══════════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: config/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════
  # Job 4: 创建 GitHub Release（tag 推送时才运行）
  # ══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, test-installer]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: koto-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Koto_v*_Setup.exe
            Koto_v*_Windows.zip
            Koto_v*_release-manifest.json
            Koto_v*_SHA256SUMS.txt

  # ══════════════════════════════════════════════════════════════════════════
  # Job 5: Sync VERSION file to match released tag
  # ══════════════════════════════════════════════════════════════════════════
  sync-version:
    name: Sync VERSION file
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VERSION file and website fallback version, then commit
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "$VERSION" > VERSION

          # Update fallback version strings in docs/index.html so even without
          # the GitHub API fetch the latest version is displayed.
          if [ -f docs/index.html ]; then
            sed -i -E 's|(<span id="version-text">)v[0-9]+\.[0-9]+\.[0-9]+|\\1v'"$VERSION"'|' docs/index.html
            sed -i -E 's|(© 2026 Koto · )v[0-9]+\.[0-9]+\.[0-9]+|\\1v'"$VERSION"'|' docs/index.html
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION docs/index.html
          git diff --cached --quiet || git commit -m "chore: sync VERSION to $VERSION [skip ci]"
          git push origin main
