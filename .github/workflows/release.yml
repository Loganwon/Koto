name: Build & Release Koto

# ─── 触发条件 ───────────────────────────────────────────────────────────────
# 1. 推送版本标签（如 v1.2.0）→ 自动构建 + 创建 GitHub Release
# 2. 手动触发（workflow_dispatch） → 只构建 + 上传 artifact，不发布 Release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）。留空则读 VERSION 文件'
        required: false
        default: ''

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject reused release tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Create a new patch tag instead of rebuilding an existing published release; reusing it preserves stale publication metadata."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME is new and safe to publish."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/tiptap-editor/package-lock.json
            web/univer-editor/package-lock.json

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.lock
          pip install pytest pytest-mock pytest-timeout pytest-playwright playwright pip-audit

      - name: Audit locked runtime dependencies
        run: pip-audit --requirement config/requirements.lock --desc

      - name: Install Chromium for browser regression
        run: python -m playwright install --with-deps chromium

      - name: Build and validate main frontend
        run: |
          npm ci --prefix web
          npm audit --prefix web --audit-level=high
          npm ci --prefix web/tiptap-editor
          npm audit --prefix web/tiptap-editor --audit-level=high
          npm ci --prefix web/univer-editor
          npm audit --prefix web/univer-editor --audit-level=high
          npm run lint --prefix web
          npm run typecheck --prefix web
          npm run build --prefix web
          npm run build --prefix web/tiptap-editor
          npm run build --prefix web/univer-editor

      - name: Run release source regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/unit/test_release_packaging_guards.py tests/unit/test_architecture_guardrails.py tests/unit/test_frontend_quality_config.py -q --tb=short
          python scripts/run_ai_assistant_flow_tests.py release -q --tb=short

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: Windows 桌面版构建（PyInstaller + Inno Setup）
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    needs: quality-gate
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/tiptap-editor/package-lock.json
            web/univer-editor/package-lock.json

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = (Get-Content VERSION -Raw -ErrorAction SilentlyContinue).Trim()
            if (-not $v) { $v = Get-Date -Format "yyyy.MM.dd" }
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building Koto version: $v"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('config/requirements.lock') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip wheel
          .\.venv\Scripts\pip install -r config\build-requirements.lock

          # Use lockfile for reproducible builds; excludes voice/gunicorn for packaging
          $lockContent = Get-Content config\requirements.lock
          $coreReqs = $lockContent | ForEach-Object {
            ($_ -split '#')[0].Trim()
          } | Where-Object {
            $_ -ne '' -and
            $_ -notmatch 'PyAudio' -and
            $_ -notmatch 'SpeechRecognition' -and
            $_ -notmatch 'vosk' -and
            $_ -notmatch 'edge.tts' -and
            $_ -notmatch 'sounddevice' -and
            $_ -notmatch 'faster.whisper' -and
            $_ -notmatch 'openai.whisper' -and
            $_ -notmatch 'gunicorn'
          }
          $coreReqs | Set-Content .venv\core_reqs.txt -Encoding ascii
          Write-Host "Installing $(($coreReqs | Measure-Object).Count) packages..."
          .\.venv\Scripts\pip install -r .venv\core_reqs.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install failed"; exit 1 }

          .\.venv\Scripts\pip install PyAudio
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::PyAudio install failed, voice will degrade at runtime"
          }
          Write-Host "Dependencies installed"

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = (& .\scripts\resolve_inno_setup.ps1 -Quiet) | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }
          }

      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          KOTO_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          KOTO_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $signingRequired = "${{ github.event_name }}" -eq "push"
          if (-not $env:KOTO_SIGNING_PFX_BASE64 -or -not $env:KOTO_SIGNING_PFX_PASSWORD) {
            if ($signingRequired) {
              Write-Host "::error::Tag releases require WINDOWS_CODE_SIGNING_PFX_BASE64 and WINDOWS_CODE_SIGNING_PFX_PASSWORD secrets."
              exit 1
            }
            Write-Host "::warning::No code-signing secrets configured; this manual build will be unsigned and cannot be published as a formal release."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "koto-code-signing.pfx"
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:KOTO_SIGNING_PFX_BASE64)
            )
            $securePassword = ConvertTo-SecureString $env:KOTO_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $securePassword `
              -Exportable:$false
          } catch {
            Write-Host "::error::Could not decode or import the Windows code-signing PFX: $($_.Exception.Message)"
            exit 1
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            if ($certificate) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Write-Host "::error::Imported signing certificate does not expose a private key."
            exit 1
          }
          "KOTO_SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported code-signing certificate: $($certificate.Subject)"

      - name: Build Windows artifacts through canonical pipeline
        shell: pwsh
        run: |
          $buildArgs = @('-Version', $env:VERSION)
          if ($env:KOTO_SIGNING_CERT_THUMBPRINT) {
            $buildArgs += @('-SigningCertificateThumbprint', $env:KOTO_SIGNING_CERT_THUMBPRINT)
          }
          if ("${{ github.event_name }}" -eq "push") {
            $buildArgs += '-RequireCodeSigning'
          }
          .\Build_Release.ps1 @buildArgs
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Canonical Windows release build failed"; exit 1 }

      - name: Remove imported code-signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:KOTO_SIGNING_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:KOTO_SIGNING_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koto-windows-release-logs
          path: logs/*.log
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koto-windows
          path: |
            dist/Koto_v*_Setup.exe
            dist/Koto_v*_Windows.zip
            dist/Koto_v*_release-manifest.json
            dist/Koto_v*_SHA256SUMS.txt
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: Installer E2E Tests (blocks release on failure)
  # ══════════════════════════════════════════════════════════════════════════
  test-installer:
    name: Installer E2E Tests
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: koto-windows
          path: dist

      - name: Run installer E2E test
        shell: pwsh
        run: |
          $setup = Get-Item "dist\Koto_v*_Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::Setup EXE not found in dist\"; exit 1 }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          Write-Host "Testing installer: $($setup.FullName)"
          Write-Host "Using available loopback port: $port"
          & tests\installer\test_installer_e2e.ps1 `
            -SetupExe $setup.FullName `
            -TestInstallDir "$env:LOCALAPPDATA\KotoCI_E2E" `
            -Port $port `
            -HealthTimeoutSec 120 `
            -RequireCodeSigning:("${{ github.event_name }}" -eq "push")
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run portable E2E test
        shell: pwsh
        run: |
          $zip = Get-Item "dist\Koto_v*_Windows.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "::error::ZIP not found; portable E2E is required for release"; exit 1 }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          Write-Host "Testing portable: $($zip.FullName)"
          Write-Host "Using available loopback port: $port"
          & tests\installer\test_portable_e2e.ps1 `
            -ZipFile $zip.FullName `
            -Port $port `
            -HealthTimeoutSec 120 `
            -RequireCodeSigning:("${{ github.event_name }}" -eq "push")
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: Docker 镜像构建（推送到 GitHub Container Registry）
  # ══════════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: config/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════
  # Job 4: 创建 GitHub Release（tag 推送时才运行）
  # ══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, test-installer, build-docker]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: koto-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Koto ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Koto_v*_Setup.exe
            Koto_v*_Windows.zip
            Koto_v*_release-manifest.json
            Koto_v*_SHA256SUMS.txt

  # ══════════════════════════════════════════════════════════════════════════
  # Job 5: Sync VERSION file to match released tag
  # ══════════════════════════════════════════════════════════════════════════
  sync-version:
    name: Sync VERSION file
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VERSION file and website fallback version, then commit
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "$VERSION" > VERSION

          # Update fallback version strings in docs/index.html so even without
          # the GitHub API fetch the latest version is displayed.
          if [ -f docs/index.html ]; then
            sed -i -E 's|(<span id="version-text">)v[0-9]+\.[0-9]+\.[0-9]+|\\1v'"$VERSION"'|' docs/index.html
            sed -i -E 's|(© 2026 Koto · )v[0-9]+\.[0-9]+\.[0-9]+|\\1v'"$VERSION"'|' docs/index.html
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION docs/index.html
          git diff --cached --quiet || git commit -m "chore: sync VERSION to $VERSION [skip ci]"
          git push origin main
