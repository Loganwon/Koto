name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/dependabot.yml'
      - 'SECURITY.md'
      - 'LICENSE'

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/univer-editor/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('config/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip wheel
          .\.venv\Scripts\pip install pyinstaller

          # Use lockfile for reproducible builds; excludes voice/gunicorn for packaging
          $lockContent = Get-Content config\requirements.lock
          $coreReqs = $lockContent | ForEach-Object {
            ($_ -split '#')[0].Trim()
          } | Where-Object {
            $_ -ne '' -and
            $_ -notmatch 'PyAudio' -and
            $_ -notmatch 'SpeechRecognition' -and
            $_ -notmatch 'vosk' -and
            $_ -notmatch 'edge.tts' -and
            $_ -notmatch 'sounddevice' -and
            $_ -notmatch 'faster.whisper' -and
            $_ -notmatch 'openai.whisper' -and
            $_ -notmatch 'gunicorn'
          }
          $coreReqs | Set-Content .venv\core_reqs.txt -Encoding ascii
          Write-Host "Installing $(($coreReqs | Measure-Object).Count) packages..."
          .\.venv\Scripts\pip install -r .venv\core_reqs.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install failed"; exit 1 }

          .\.venv\Scripts\pip install PyAudio
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::PyAudio install failed, voice will degrade at runtime"
          }

      - name: Build frontend assets
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Main frontend npm ci failed"; exit 1 }
          npm audit --prefix web --audit-level=high
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Main frontend dependency audit failed"; exit 1 }
          npm run build --prefix web
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Main frontend build failed"; exit 1 }
          npm ci --prefix web/univer-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Univer frontend npm ci failed"; exit 1 }
          npm audit --prefix web/univer-editor --audit-level=high
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Univer frontend dependency audit failed"; exit 1 }
          npm run build --prefix web/univer-editor
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Univer frontend build failed"; exit 1 }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          .\.venv\Scripts\pyinstaller.exe koto.spec --clean -y *> logs\build_latest.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller build failed. Last 60 lines:"
            Get-Content logs\build_latest.log -Tail 60
            exit 1
          }
          Write-Host "Build OK -> dist\Koto\Koto.exe"

      - name: Determine version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw -ErrorAction SilentlyContinue).Trim()
          if (-not $v) { $v = Get-Date -Format "yyyy.MM.dd" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Assemble portable package
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          .\.venv\Scripts\python.exe src\deploy_portable.py --allow-missing-installer
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::deploy_portable.py failed"; exit 1 }

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = (& .\scripts\resolve_inno_setup.ps1 -Quiet) | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (& .\scripts\resolve_inno_setup.ps1 -Quiet) | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path $iscc)) { Write-Host "::error::Inno Setup 6 not found"; exit 1 }
          & $iscc /DAppVersion=$env:VERSION koto_installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup build failed"; exit 1 }
          $setupName = "Koto_v$($env:VERSION)_Setup.exe"
          $sizeMB = [math]::Round((Get-Item "dist\$setupName").Length / 1MB, 1)
          Write-Host "Installer: $setupName ($sizeMB MB)"

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $zipName = "Koto_v$($env:VERSION)_Windows.zip"
          Compress-Archive -Path "dist\Koto_Portable\*" -DestinationPath "dist\$zipName" -CompressionLevel Optimal
          Write-Host "Created: dist\$zipName"

      - name: Generate release manifest and SHA-256 checksums
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\write_release_manifest.py `
            --version $env:VERSION `
            --output "dist\Koto_v$($env:VERSION)_release-manifest.json" `
            --hash-output "dist\Koto_v$($env:VERSION)_SHA256SUMS.txt" `
            "dist\Koto_v$($env:VERSION)_Setup.exe" `
            "dist\Koto_v$($env:VERSION)_Windows.zip"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Release manifest generation failed"; exit 1 }

      - name: Run installer E2E test
        shell: pwsh
        run: |
          $setup = Get-Item "dist\Koto_v*_Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::Setup EXE not found"; exit 1 }
          Write-Host "Testing installer: $($setup.FullName)"
          & tests\installer\test_installer_e2e.ps1 `
            -SetupExe $setup.FullName `
            -TestInstallDir "$env:LOCALAPPDATA\KotoCI_Build" `
            -Port 5099 `
            -HealthTimeoutSec 60
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run portable E2E test
        shell: pwsh
        run: |
          $zip = Get-Item "dist\Koto_v*_Windows.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "::error::ZIP not found; portable E2E is required for build artifacts"; exit 1 }
          Write-Host "Testing portable: $($zip.FullName)"
          & tests\installer\test_portable_e2e.ps1 `
            -ZipFile $zip.FullName `
            -Port 5098 `
            -HealthTimeoutSec 60
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koto-windows-build
          path: |
            dist/Koto_v*_Setup.exe
            dist/Koto_v*_Windows.zip
            dist/Koto_v*_release-manifest.json
            dist/Koto_v*_SHA256SUMS.txt
          retention-days: 14
