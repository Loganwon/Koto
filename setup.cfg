[isort]
profile = black

[bandit]
exclude = tests,.venv,build,dist,web/static/vendor,web/static/js/build,web/static/univer-dist
skips = B101

[mutmut]
paths_to_mutate=web/auth.py,web/app.py
tests_dir=tests/unit/
runner=python -m pytest tests/unit/test_auth_coverage.py tests/unit/test_security_hardening.py -x -q --no-header --tb=no
