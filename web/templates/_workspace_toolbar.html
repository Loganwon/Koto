<header class="koto-workspace-toolbar">
  <div class="koto-toolbar-start">
    <button type="button" class="koto-icon-button" id="koto-nav-toggle" data-koto-shell-action="navigation" aria-label="展开任务导航" aria-controls="sideNav" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <span class="koto-workspace-label"><strong id="wa-ai-chat-title">新任务</strong><span id="wa-ai-chat-subtitle" hidden></span></span>
  </div>
  <div class="koto-toolbar-actions">
    <button type="button" id="koto-document-toggle" class="koto-toolbar-button" data-koto-shell-action="document" aria-controls="wa-canvas" hidden>文档与成果</button>
    <button type="button" id="koto-files-toggle" class="koto-toolbar-button" data-koto-shell-action="files" aria-controls="wa-left" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3h8v2"/></svg>材料与文件</button>
  </div>
</header>
<button type="button" class="koto-files-scrim" data-koto-shell-action="close-files" aria-label="关闭文件列表" tabindex="-1"></button>
<button type="button" class="koto-nav-scrim" data-koto-shell-action="close-navigation" aria-label="关闭任务导航" tabindex="-1"></button>
