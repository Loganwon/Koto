<!-- Split.js served locally so a CDN failure cannot crash the workspace runtime -->
<script src="{{ asset_url('vendor/split.min.js') }}"></script>
<script>
  window.__kotoStartupErrors = window.__kotoStartupErrors || [];
  document.documentElement.setAttribute('data-koto-startup-monitor', 'ready');
  function recordKotoStartupError(payload) {
    window.__kotoStartupErrors.push(payload);
    document.documentElement.setAttribute(
      'data-koto-startup-error',
      JSON.stringify(window.__kotoStartupErrors.slice(-5))
    );
  }
  window.addEventListener('error', function(event) {
    recordKotoStartupError({
      type: 'error',
      message: String(event.message || 'Unknown startup error'),
      source: String(event.filename || ''),
      line: Number(event.lineno || 0),
      column: Number(event.colno || 0)
    });
  });
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    recordKotoStartupError({
      type: 'unhandledrejection',
      message: reason && reason.message ? String(reason.message) : String(reason || 'Unknown rejection')
    });
  });
  var WA = window.WA = window.WA || {};
  WA._pendingSendBrowserFilesToAI = WA._pendingSendBrowserFilesToAI || [];
  window.__kotoWorkspaceEditorAssets = {
    'pptx-editor-bundle': {{ asset_url('js/build/pptx-editor-bundle.js')|tojson }},
    'pdf-viewer-bundle': {{ asset_url('js/build/pdf-viewer-bundle.js')|tojson }},
    'xlsx-editor-bundle': {{ asset_url('js/build/xlsx-editor-bundle.js')|tojson }},
    'image-viewer-bundle': {{ asset_url('js/build/image-viewer-bundle.js')|tojson }},
    'docx-review-engine-bundle': {{ asset_url('js/build/docx-review-engine-bundle.js')|tojson }},
    'frontend-observer-bundle': {{ asset_url('js/build/frontend-observer-bundle.js')|tojson }},
    'find-replace-bundle': {{ asset_url('js/build/find-replace-bundle.js')|tojson }},
    'task-workbench-bundle': {{ asset_url('js/build/task-workbench-bundle.js')|tojson }},
    'conversation-list-bundle': {{ asset_url('js/build/conversation-list-bundle.js')|tojson }},
    'fs-context-menu-bundle': {{ asset_url('js/build/fs-context-menu-bundle.js')|tojson }}
  };
  WA.sendBrowserFileToAI = WA.sendBrowserFileToAI || function(path) {
    path = String(path || '').trim();
    if (!path) return Promise.resolve();
    if (typeof WA.attachFilesToTask === 'function') {
      return WA.attachFilesToTask([path], { source: 'file_tree_inline_action', focusInput: true });
    }
    WA._pendingSendBrowserFilesToAI.push(path);
    return Promise.resolve();
  };
</script>
