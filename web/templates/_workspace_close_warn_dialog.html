<div
  id="wa-close-warn-overlay"
  class="wa-close-warn-overlay"
  style="display:none"
  role="presentation"
>
  <div
    id="wa-close-warn-dialog"
    class="wa-close-warn-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="wa-close-warn-title"
    tabindex="-1"
  >
    <div class="wa-close-warn-head">
      <div class="wa-close-warn-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"></path>
          <path d="M12 17h.01"></path>
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
        </svg>
      </div>
      <div class="wa-close-warn-copy">
        <div id="wa-close-warn-title" class="wa-close-warn-title">是否保存更改？</div>
        <p class="wa-close-warn-description">关闭 Koto 前，请先处理未保存的文件。</p>
      </div>
      <button
        type="button"
        class="wa-btn wa-close-warn-close"
        onclick="WA._closeWarnCancel()"
        aria-label="取消关闭"
        title="取消关闭"
      >×</button>
    </div>
    <div class="wa-close-warn-body">
      <div class="wa-close-warn-list-head">
        <span id="wa-close-warn-count" class="wa-close-warn-count">0 个未保存文件</span>
        <span class="wa-close-warn-risk">不保存将丢失更改</span>
      </div>
      <div id="wa-close-warn-list" class="wa-close-warn-list"></div>
    </div>
    <div class="wa-close-warn-footer">
      <p id="wa-close-warn-status" class="wa-close-warn-footer-note" aria-live="polite">保存后会自动关闭 Koto。</p>
      <div class="wa-close-warn-actions">
        <button type="button" class="wa-btn wa-close-warn-cancel" onclick="WA._closeWarnCancel()">取消</button>
        <button type="button" class="wa-btn wa-close-warn-discard" onclick="WA._closeWarnDiscard()">不保存并退出</button>
        <button type="button" class="wa-btn primary wa-close-warn-save" onclick="WA._closeWarnSaveAll()">保存并退出</button>
      </div>
    </div>
  </div>
</div>
