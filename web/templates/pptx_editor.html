<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koto PPTX 编辑器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      height: 52px; background: #1a1a2e; color: #fff; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .topbar-logo { font-size: 16px; font-weight: 700; color: #7c83fd; letter-spacing: .5px; }
    .topbar-name { font-size: 15px; font-weight: 500; flex: 1; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
    .topbar-badge { font-size: 11px; background: #7c83fd22; color: #a5abff;
                    padding: 2px 8px; border-radius: 12px; border: 1px solid #7c83fd44; }
    .btn { padding: 7px 16px; border: none; border-radius: 6px; font-size: 13px;
           font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn-primary { background: #7c83fd; color: #fff; }
    .btn-primary:hover { background: #636af5; }
    .btn-secondary { background: #2a2a4a; color: #c8ccff; border: 1px solid #3a3a6a; }
    .btn-secondary:hover { background: #353560; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #a93226; }

    /* ── Upload overlay (shown when no file loaded) ── */
    #upload-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #0d0d1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
    }
    .upload-logo { font-size: 24px; font-weight: 800; color: #7c83fd; }
    .upload-zone {
      width: 480px; max-width: 90vw;
      border: 2px dashed #7c83fd88; border-radius: 16px;
      padding: 48px 32px; text-align: center;
      color: #a5abff; background: #13132a;
      cursor: pointer; transition: all .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #7c83fd; background: #1a1a3a; }
    .upload-zone-icon { font-size: 48px; margin-bottom: 16px; }
    .upload-zone-title { font-size: 18px; font-weight: 600; color: #c8ccff; margin-bottom: 8px; }
    .upload-zone-sub { font-size: 13px; color: #6668aa; }
    .upload-or { font-size: 13px; color: #6668aa; }
    #upload-input { display: none; }
    .upload-select-btn {
      padding: 10px 28px; background: #7c83fd; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
      transition: background .15s;
    }
    .upload-select-btn:hover { background: #636af5; }
    .upload-list-link {
      font-size: 13px; color: #7c83fd88; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .upload-list-link:hover { color: #7c83fd; }

    /* ── Main layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar: slide list ── */
    .sidebar {
      width: 220px; flex-shrink: 0; background: #1a1a2e;
      display: flex; flex-direction: column; overflow: hidden;
      border-right: 1px solid #2a2a4a;
    }
    .sidebar-header {
      padding: 12px 14px; border-bottom: 1px solid #2a2a4a;
      font-size: 12px; font-weight: 600; color: #7c83fd; text-transform: uppercase;
      letter-spacing: .6px; display: flex; align-items: center; justify-content: space-between;
    }
    .slide-count-badge { background: #7c83fd22; color: #a5abff;
                         padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .slides-list { flex: 1; overflow-y: auto; padding: 8px 6px; }
    .slide-thumb {
      padding: 8px 10px; margin-bottom: 4px; border-radius: 6px;
      cursor: pointer; transition: all .15s; border: 2px solid transparent;
      background: #13132a;
    }
    .slide-thumb:hover { background: #20204a; }
    .slide-thumb.active { background: #1e1e42; border-color: #7c83fd; }
    .slide-thumb-num { font-size: 10px; color: #6668aa; font-weight: 600; }
    .slide-thumb-title { font-size: 12px; color: #c8ccff; white-space: nowrap;
                         overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .slide-thumb-shapes { font-size: 10px; color: #6668aa; margin-top: 2px; }

    /* ── Editor panel ── */
    .editor-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      background: #0d0d1a;
    }
    .editor-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      border-bottom: 1px solid #2a2a4a; flex-shrink: 0;
    }
    .editor-toolbar-title { font-size: 14px; font-weight: 600; color: #c8ccff; flex: 1; }
    .editor-body { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .editor-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #44447a; font-size: 15px; gap: 12px;
    }
    .editor-empty-icon { font-size: 48px; }

    /* ── Shape cards ── */
    .shape-card {
      background: #13132a; border: 1px solid #2a2a4a; border-radius: 10px;
      padding: 16px 18px; margin-bottom: 16px; transition: border-color .15s;
    }
    .shape-card:hover { border-color: #7c83fd55; }
    .shape-card-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .shape-icon { font-size: 16px; }
    .shape-name { font-size: 12px; font-weight: 600; color: #7c83fd; }
    .shape-type { font-size: 11px; color: #6668aa; margin-left: auto; }
    .para-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .para-run-label { font-size: 10px; color: #44447a; width: 42px;
                      flex-shrink: 0; margin-top: 9px; }
    .run-input {
      flex: 1; background: #0d0d1a; color: #e0e3ff; border: 1px solid #2a2a4a;
      border-radius: 5px; padding: 7px 10px; font-size: 13px;
      resize: vertical; min-height: 36px; font-family: inherit;
      transition: border-color .15s;
    }
    .run-input:focus { outline: none; border-color: #7c83fd; }
    .run-badges { display: flex; gap: 4px; align-items: center; flex-shrink: 0; margin-top: 9px; }
    .badge {
      font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600;
      color: #a5abff; background: #7c83fd22;
    }
    .no-text-note { font-size: 12px; color: #44447a; font-style: italic; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: #1a1a3a; color: #c8ccff; padding: 10px 18px;
      border-radius: 8px; font-size: 13px; border: 1px solid #7c83fd44;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
      opacity: 0; transform: translateY(12px);
      transition: opacity .25s, transform .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: none; }
    #toast.error { border-color: #c0392b44; color: #f1948a; }

    /* ── Saved files list modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.65); align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px;
      padding: 24px; width: 520px; max-width: 95vw; max-height: 80vh;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #c8ccff; }
    .file-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .file-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: #13132a; border-radius: 8px; border: 1px solid #2a2a4a;
    }
    .file-row-name { flex: 1; font-size: 13px; color: #c8ccff; white-space: nowrap;
                      overflow: hidden; text-overflow: ellipsis; }
    .file-row-meta { font-size: 11px; color: #6668aa; }
    .file-row-open { padding: 4px 12px; font-size: 12px; background: #7c83fd;
                     color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .file-row-open:hover { background: #636af5; }
    .file-row-del { padding: 4px 10px; font-size: 12px; background: #c0392b22;
                    color: #f1948a; border: 1px solid #c0392b44; border-radius: 5px; cursor: pointer; }
    .file-row-del:hover { background: #c0392b44; }
    .loading-msg { color: #6668aa; font-size: 13px; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<!-- ── Upload overlay ── -->
<div id="upload-overlay">
  <div class="upload-logo">📊 Koto PPTX 编辑器</div>
  <div class="upload-zone" id="upload-zone"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <div class="upload-zone-icon">📂</div>
    <div class="upload-zone-title">拖放 PPTX 文件到此处</div>
    <div class="upload-zone-sub">.pptx / .pptm / .ppt</div>
  </div>
  <div class="upload-or">— 或 —</div>
  <button class="upload-select-btn" onclick="document.getElementById('upload-input').click()">
    选择文件
  </button>
  <input id="upload-input" type="file" accept=".pptx,.pptm,.ppt" onchange="onFileSelected(event)" />
  <span class="upload-list-link" onclick="openFileListModal()">📋 打开已保存的演示文稿</span>
</div>

<!-- ── Main editor (hidden until file loaded) ── -->
<div id="main-editor" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
  <!-- Top bar -->
  <div class="topbar">
    <span class="topbar-logo">📊</span>
    <span class="topbar-name" id="topbar-name">演示文稿</span>
    <span class="topbar-badge" id="topbar-badge">0 页</span>
    <button class="btn btn-secondary" onclick="showUploadOverlay()">📂 重新上传</button>
    <button class="btn btn-secondary" onclick="openFileListModal()">📋 文件列表</button>
    <button class="btn btn-primary" onclick="saveEdits()">💾 保存</button>
    <button class="btn btn-primary" onclick="downloadPptx()">⬇️ 下载</button>
  </div>

  <!-- Main layout -->
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        幻灯片
        <span class="slide-count-badge" id="slide-count-badge">0</span>
      </div>
      <div class="slides-list" id="slides-list"></div>
    </div>

    <!-- Editor -->
    <div class="editor-panel">
      <div class="editor-toolbar">
        <span class="editor-toolbar-title" id="editor-toolbar-title">选择一页幻灯片进行编辑</span>
        <button class="btn btn-secondary" onclick="prevSlide()">◀</button>
        <button class="btn btn-secondary" onclick="nextSlide()">▶</button>
      </div>
      <div class="editor-body" id="editor-body">
        <div class="editor-empty">
          <div class="editor-empty-icon">🖱️</div>
          <div>点击左侧幻灯片缩略图开始编辑</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── File list modal ── -->
<div class="modal-overlay" id="file-list-modal" onclick="closeFileListModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">📋 已保存的演示文稿</div>
    <div class="file-list" id="file-list-content">
      <div class="loading-msg">正在加载…</div>
    </div>
    <button class="btn btn-secondary" onclick="closeFileListModal()">关闭</button>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<script>
"use strict";

let _fileId = null;
let _meta = null;         // full session JSON from the API
let _currentSlide = 0;

// ── Init from URL (e.g. /pptx-editor/abc123) ─────────────────────────────
(function init() {
  const m = location.pathname.match(/\/pptx-editor\/([a-zA-Z0-9_-]+)/);
  if (m) {
    _fileId = m[1];
    loadFileById(_fileId);
  }
})();

// ── Upload helpers ────────────────────────────────────────────────────────
function showUploadOverlay() {
  document.getElementById('upload-overlay').style.display = 'flex';
  document.getElementById('main-editor').style.display = 'none';
}

function onDragOver(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.add('drag-over');
}
function onDragLeave() {
  document.getElementById('upload-zone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
}
function onFileSelected(e) {
  const file = e.target.files[0];
  if (file) uploadFile(file);
}

async function uploadFile(file) {
  const allowed = ['.pptx', '.ppt', '.pptm'];
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  if (!allowed.includes(ext)) {
    toast('只支持 .pptx / .pptm / .ppt 文件', true);
    return;
  }

  toast('正在上传并解析…');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/pptx/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) { toast(data.error || '上传失败', true); return; }
    _fileId = data.id;
    history.replaceState({}, '', `/pptx-editor/${_fileId}`);
    await loadFileById(_fileId);
  } catch (err) {
    toast('上传出错: ' + err.message, true);
  }
}

async function loadFileById(id) {
  toast('正在加载…');
  try {
    const res = await fetch(`/api/pptx/${id}`);
    if (!res.ok) { toast('文件不存在或已被删除', true); return; }
    _meta = await res.json();
    _currentSlide = 0;
    renderEditor();
    document.getElementById('upload-overlay').style.display = 'none';
    const me = document.getElementById('main-editor');
    me.style.display = 'flex';
    me.style.flexDirection = 'column';
    toast(`已加载 ${_meta.slides.length} 页幻灯片`);
  } catch (err) {
    toast('加载出错: ' + err.message, true);
  }
}

// ── Render ───────────────────────────────────────────────────────────────
function renderEditor() {
  if (!_meta) return;

  document.getElementById('topbar-name').textContent = _meta.name || '演示文稿';
  document.getElementById('topbar-badge').textContent = `${_meta.slides.length} 页`;
  document.getElementById('slide-count-badge').textContent = _meta.slides.length;

  // Sidebar
  const list = document.getElementById('slides-list');
  list.innerHTML = '';
  _meta.slides.forEach((slide, idx) => {
    const firstTextShape = slide.shapes.find(s => s.has_text && s.paragraphs.length);
    const firstText = firstTextShape
      ? (firstTextShape.paragraphs[0]?.runs?.map(r => r.text).join('') || '').trim()
      : '';
    const thumb = document.createElement('div');
    thumb.className = 'slide-thumb' + (idx === _currentSlide ? ' active' : '');
    thumb.innerHTML = `
      <div class="slide-thumb-num">第 ${idx + 1} 页</div>
      <div class="slide-thumb-title">${esc(firstText || '(空白幻灯片)')}</div>
      <div class="slide-thumb-shapes">${slide.shapes.filter(s=>s.has_text).length} 个文字框</div>
    `;
    thumb.onclick = () => selectSlide(idx);
    list.appendChild(thumb);
  });

  renderSlideEditor();
}

function selectSlide(idx) {
  _currentSlide = idx;
  document.querySelectorAll('.slide-thumb').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  renderSlideEditor();
}

function prevSlide() { if (_currentSlide > 0) selectSlide(_currentSlide - 1); }
function nextSlide() { if (_meta && _currentSlide < _meta.slides.length - 1) selectSlide(_currentSlide + 1); }

function renderSlideEditor() {
  const body = document.getElementById('editor-body');
  const titleEl = document.getElementById('editor-toolbar-title');
  if (!_meta || _meta.slides.length === 0) {
    body.innerHTML = '<div class="editor-empty"><div class="editor-empty-icon">📭</div><div>无幻灯片</div></div>';
    return;
  }

  const slide = _meta.slides[_currentSlide];
  titleEl.textContent = `第 ${_currentSlide + 1} 页  ·  ${slide.shapes.filter(s=>s.has_text).length} 个文字区域`;

  const textShapes = slide.shapes.filter(s => s.has_text);
  if (textShapes.length === 0) {
    body.innerHTML = '<div class="editor-empty"><div class="editor-empty-icon">🖼️</div><div>此页无文字内容（含图片/形状）</div></div>';
    return;
  }

  let html = '';
  textShapes.forEach((shape, si) => {
    const icon = shapeIcon(shape.type);
    html += `<div class="shape-card" data-shape-id="${shape.id}" data-shape-idx="${si}">`;
    html += `<div class="shape-card-header">
      <span class="shape-icon">${icon}</span>
      <span class="shape-name">${esc(shape.name)}</span>
      <span class="shape-type">${esc(shape.type)}</span>
    </div>`;

    shape.paragraphs.forEach((para, pi) => {
      para.runs.forEach((run, ri) => {
        const badges = [];
        if (run.bold) badges.push('<span class="badge">B</span>');
        if (run.italic) badges.push('<span class="badge">I</span>');
        if (run.underline) badges.push('<span class="badge">U</span>');
        if (run.size) badges.push(`<span class="badge">${run.size}pt</span>`);

        html += `<div class="para-row">
          <span class="para-run-label">P${pi+1}·R${ri+1}</span>
          <textarea class="run-input"
            data-slide="${_currentSlide}" data-shape-id="${shape.id}"
            data-para="${pi}" data-run="${ri}"
            rows="1"
            oninput="autoResize(this); onRunInput(this)"
          >${esc(run.text)}</textarea>
          <span class="run-badges">${badges.join('')}</span>
        </div>`;
      });
      if (para.runs.length === 0) {
        html += `<div class="para-row"><span class="para-run-label">P${pi+1}</span>
          <span class="no-text-note">(空段落)</span></div>`;
      }
    });

    html += '</div>';
  });

  body.innerHTML = html;
  body.querySelectorAll('.run-input').forEach(autoResize);
}

// ── Data binding ─────────────────────────────────────────────────────────
function onRunInput(el) {
  const slideIdx = parseInt(el.dataset.slide, 10);
  const shapeId  = parseInt(el.dataset.shapeId, 10);
  const paraIdx  = parseInt(el.dataset.para, 10);
  const runIdx   = parseInt(el.dataset.run, 10);

  const shape = _meta.slides[slideIdx].shapes.find(s => s.id === shapeId);
  if (!shape) return;
  if (shape.paragraphs[paraIdx] && shape.paragraphs[paraIdx].runs[runIdx] !== undefined) {
    shape.paragraphs[paraIdx].runs[runIdx].text = el.value;
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight) + 'px';
}

// ── Save & Download ───────────────────────────────────────────────────────
async function saveEdits() {
  if (!_meta) return;
  toast('正在保存…');
  try {
    const res = await fetch(`/api/pptx/${_fileId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slides: _meta.slides }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || '保存失败', true); return; }
    toast('✅ 已保存');
  } catch (err) {
    toast('保存出错: ' + err.message, true);
  }
}

async function downloadPptx() {
  if (!_meta) return;
  // Save first, then download
  await saveEdits();
  toast('正在生成 PPTX…');
  try {
    const res = await fetch(`/api/pptx/${_fileId}/download`);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      toast(d.error || '下载失败', true);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${_meta.name || 'presentation'}_edited.pptx`;
    a.click();
    URL.revokeObjectURL(url);
    toast('⬇️ 下载开始');
  } catch (err) {
    toast('下载出错: ' + err.message, true);
  }
}

// ── File list modal ───────────────────────────────────────────────────────
async function openFileListModal() {
  document.getElementById('file-list-modal').classList.add('show');
  const content = document.getElementById('file-list-content');
  content.innerHTML = '<div class="loading-msg">正在加载…</div>';
  try {
    const res = await fetch('/api/pptx/list');
    const data = await res.json();
    if (data.files.length === 0) {
      content.innerHTML = '<div class="loading-msg">暂无已保存的演示文稿</div>';
      return;
    }
    content.innerHTML = data.files.map(f => `
      <div class="file-row">
        <span class="file-row-name">📊 ${esc(f.name || f.originalFilename)}</span>
        <span class="file-row-meta">${f.slideCount} 页</span>
        <button class="file-row-open" onclick="openFileFromList('${f.id}')">打开</button>
        <button class="file-row-del" onclick="deleteFileFromList('${f.id}', this)">删除</button>
      </div>`).join('');
  } catch (err) {
    content.innerHTML = `<div class="loading-msg" style="color:#f1948a">加载失败: ${esc(err.message)}</div>`;
  }
}

function closeFileListModal(e) {
  if (!e || e.target === document.getElementById('file-list-modal')) {
    document.getElementById('file-list-modal').classList.remove('show');
  }
}

function openFileFromList(id) {
  closeFileListModal();
  _fileId = id;
  history.replaceState({}, '', `/pptx-editor/${id}`);
  loadFileById(id);
}

async function deleteFileFromList(id, btn) {
  if (!confirm('确定删除此演示文稿？此操作不可恢复。')) return;
  try {
    const res = await fetch(`/api/pptx/${id}`, { method: 'DELETE' });
    if (res.ok) {
      btn.closest('.file-row').remove();
      if (id === _fileId) showUploadOverlay();
    } else {
      toast('删除失败', true);
    }
  } catch (err) {
    toast('删除出错', true);
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shapeIcon(type) {
  if (!type) return '📝';
  const t = String(type).toUpperCase();
  if (t.includes('PICTURE') || t.includes('13')) return '🖼️';
  if (t.includes('TABLE') || t.includes('19')) return '📊';
  if (t.includes('CHART') || t.includes('3')) return '📈';
  return '📝';
}

let _toastTimer = null;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}
</script>
</body>
