<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Koto PPTX 编辑器</title>
<style>
/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f3f3f3;
     display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none;}

/* ── Upload screen ── */
#upload-screen{
  position:fixed;inset:0;z-index:200;
  background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.up-logo{font-size:20px;font-weight:700;color:#d04f20;display:flex;align-items:center;gap:8px;}
.up-logo span{font-size:28px;}
.up-drop{
  width:480px;max-width:92vw;border:2px dashed #c8c8c8;border-radius:10px;
  padding:52px 32px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa;
}
.up-drop:hover,.up-drop.drag{border-color:#d04f20;background:#fff5f0;}
.up-drop-icon{font-size:52px;margin-bottom:12px;}
.up-drop-title{font-size:17px;font-weight:600;color:#222;margin-bottom:6px;}
.up-drop-sub{font-size:13px;color:#888;}
#up-input{display:none;}
.up-btn{
  padding:10px 32px;background:#d04f20;color:#fff;border:none;border-radius:6px;
  font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;
}
.up-btn:hover{background:#b8401a;}
.up-recent{font-size:13px;color:#888;cursor:pointer;text-decoration:underline;}
.up-recent:hover{color:#d04f20;}

/* ── Title bar (mimics Office) ── */
#titlebar{
  display:none;flex-shrink:0;
  background:#d04f20;color:#fff;height:36px;
  align-items:center;padding:0 12px;gap:10px;
}
.tb-logo{font-size:14px;font-weight:700;letter-spacing:.3px;opacity:.95;}
.tb-name{
  flex:1;font-size:13px;font-weight:400;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-btn{
  padding:4px 12px;background:rgba(255,255,255,.15);color:#fff;border:none;
  border-radius:3px;font-size:12px;cursor:pointer;transition:background .12s;white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.28);}
.tb-btn.accent{background:rgba(255,255,255,.25);}

/* ── Ribbon ── */
#ribbon{
  display:none;flex-shrink:0;
  background:#fff;border-bottom:1px solid #d0d0d0;height:46px;
  align-items:center;padding:0 10px;gap:2px;
}
.rib-group{display:flex;align-items:center;gap:2px;padding:0 6px;
           border-right:1px solid #e0e0e0;}
.rib-group:last-child{border:none;}
.rib-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 8px;border:none;background:transparent;border-radius:3px;
  font-size:11px;color:#333;cursor:pointer;gap:2px;min-width:36px;
  transition:background .12s;
}
.rib-btn:hover{background:#e8e8e8;}
.rib-btn .ri{font-size:18px;line-height:1;}
.rib-sep{width:1px;height:28px;background:#e0e0e0;margin:0 2px;}
.rib-zoom{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:#555;}
.rib-zoom input[type=range]{width:80px;accent-color:#d04f20;}

/* ── Main workspace ── */
#workspace{display:none;flex:1;overflow:hidden;display:none;flex-direction:row;}

/* ── Slide panel (left thumbnails) ── */
#slide-panel{
  width:160px;flex-shrink:0;background:#f0f0f0;
  border-right:1px solid #d0d0d0;overflow-y:auto;padding:8px 6px;
  display:flex;flex-direction:column;gap:6px;
}
.slide-thumb{
  position:relative;cursor:pointer;border:2px solid transparent;
  border-radius:3px;overflow:hidden;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.15);transition:all .12s;
}
.slide-thumb:hover{border-color:#aaa;}
.slide-thumb.active{border-color:#d04f20;box-shadow:0 0 0 2px #d04f2044;}
.slide-thumb canvas{width:100%;display:block;}
.slide-thumb-num{
  position:absolute;bottom:2px;right:4px;font-size:9px;color:#888;
  text-shadow:0 0 3px #fff;
}

/* ── Canvas area ── */
#canvas-area{
  flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  padding:20px;background:#737373;
}
/* The slide wrapper (white rectangle) */
#slide-wrapper{
  position:relative;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.45);
  flex-shrink:0;
}
/* Each shape div */
.shape{
  position:absolute;overflow:hidden;cursor:move;
}
.shape.has-text{cursor:move;}
/* Selection glow on shape */
.shape.selected{
  overflow:visible!important;
  outline:2px solid #0078d4;
  outline-offset:0px;
  z-index:10;
}
.shape.selected::after{
  content:'';position:absolute;inset:-1px;pointer-events:none;
  border:1px solid #0078d4;z-index:10;
}
.shape-inner{
  width:100%;height:100%;overflow:hidden;padding:4px 6px;
  display:flex;flex-direction:column;justify-content:flex-start;
  cursor:text;user-select:text;
}
/* Paragraph inside shape */
.shape-para{line-height:1.3;white-space:pre-wrap;word-break:break-word;}
/* Inline run spans */
.run-span{outline:none;}
.run-span[contenteditable="true"]:focus{outline:none;}
/* Resize handles */
.handle{
  position:absolute;width:10px;height:10px;background:#0078d4;border:2px solid #fff;
  border-radius:2px;display:none;z-index:11;box-sizing:border-box;
}
.shape.selected .handle{display:block;}
.handle.tl{top:-5px;left:-5px;cursor:nw-resize;}
.handle.tr{top:-5px;right:-5px;cursor:ne-resize;}
.handle.bl{bottom:-5px;left:-5px;cursor:sw-resize;}
.handle.br{bottom:-5px;right:-5px;cursor:se-resize;}
.handle.tm{top:-5px;left:50%;transform:translateX(-50%);cursor:n-resize;}
.handle.bm{bottom:-5px;left:50%;transform:translateX(-50%);cursor:s-resize;}
.handle.ml{left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize;}
.handle.mr{right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize;}

/* ── Status bar ── */
#statusbar{
  display:none;flex-shrink:0;height:22px;background:#f0f0f0;border-top:1px solid #d0d0d0;
  display:none;align-items:center;padding:0 12px;gap:16px;font-size:11px;color:#555;
}

/* ── Toast ── */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#323130;color:#fff;padding:8px 18px;border-radius:4px;font-size:13px;
  opacity:0;transition:all .22s;pointer-events:none;z-index:9999;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:#a4262c;}

/* ── File list modal ── */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.4);align-items:center;justify-content:center;
}
.modal-bg.show{display:flex;}
.modal{
  background:#fff;border-radius:4px;width:520px;max-width:95vw;max-height:80vh;
  display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.28);
}
.modal-head{
  padding:16px 20px;border-bottom:1px solid #e0e0e0;
  font-size:15px;font-weight:600;color:#111;display:flex;align-items:center;
  justify-content:space-between;
}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#555;}
.modal-body{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:6px;}
.frow{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border:1px solid #e0e0e0;border-radius:3px;
}
.frow-icon{font-size:22px;}
.frow-name{flex:1;font-size:13px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.frow-meta{font-size:11px;color:#888;white-space:nowrap;}
.frow-open{
  padding:4px 12px;background:#d04f20;color:#fff;border:none;border-radius:3px;
  font-size:12px;cursor:pointer;
}
.frow-del{
  padding:4px 10px;background:#fff;color:#a4262c;border:1px solid #a4262c;
  border-radius:3px;font-size:12px;cursor:pointer;
}
.modal-foot{padding:12px 16px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#f0f0f0;}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px;}
</style>
</head>
<body>

<!-- ═══════════════════════════════ UPLOAD SCREEN ═════════════════════════════ -->
<div id="upload-screen">
  <div class="up-logo"><span>📊</span> Koto PPTX 编辑器</div>
  <div class="up-drop" id="up-drop"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)"
       onclick="document.getElementById('up-input').click()">
    <div class="up-drop-icon">📂</div>
    <div class="up-drop-title">拖放 PowerPoint 文件</div>
    <div class="up-drop-sub">.pptx &nbsp;·&nbsp; .pptm &nbsp;·&nbsp; .ppt</div>
  </div>
  <input id="up-input" type="file" accept=".pptx,.pptm,.ppt" onchange="onFilePick(event)"/>
  <button class="up-btn" onclick="document.getElementById('up-input').click()">选择文件…</button>
  <span class="up-recent" onclick="openFileMgr()">📋 打开已保存的文件</span>
</div>

<!-- ═══════════════════════════════ TITLE BAR ═════════════════════════════════ -->
<div id="titlebar">
  <span class="tb-logo">📊 Koto</span>
  <span class="tb-name" id="tb-name">演示文稿</span>
  <button class="tb-btn" onclick="document.getElementById('up-input').click()">打开</button>
  <button class="tb-btn" onclick="openFileMgr()">文件列表</button>
  <button class="tb-btn accent" onclick="doSave()">保存</button>
  <button class="tb-btn accent" onclick="doDownload()">⬇ 下载 .pptx</button>
</div>

<!-- ═══════════════════════════════ RIBBON ════════════════════════════════════ -->
<div id="ribbon">
  <div class="rib-group">
    <button class="rib-btn" onclick="document.getElementById('up-input').click()"><span class="ri">📂</span>打开</button>
    <button class="rib-btn" onclick="doSave()"><span class="ri">💾</span>保存</button>
    <button class="rib-btn" onclick="doDownload()"><span class="ri">⬇️</span>下载</button>
  </div>
  <div class="rib-group">
    <button class="rib-btn" onclick="prevSlide()" title="上一张"><span class="ri">◀</span>上一张</button>
    <button class="rib-btn" onclick="nextSlide()" title="下一张"><span class="ri">▶</span>下一张</button>
  </div>
  <div class="rib-group">
    <button class="rib-btn" id="btn-bold" onmousedown="event.preventDefault()" onclick="execFmt('bold')"><span class="ri">𝐁</span>加粗</button>
    <button class="rib-btn" id="btn-italic" onmousedown="event.preventDefault()" onclick="execFmt('italic')"><span class="ri">𝐼</span>斜体</button>
    <button class="rib-btn" id="btn-underline" onmousedown="event.preventDefault()" onclick="execFmt('underline')"><span class="ri">U̲</span>下划线</button>
  </div>
  <div class="rib-group" style="align-items:center;gap:4px;">
    <label style="font-size:11px;color:#555;" for="font-size-input">pt</label>
    <input type="number" id="font-size-input" min="6" max="400" placeholder="–"
           style="width:50px;border:1px solid #d0d0d0;border-radius:3px;padding:2px 4px;font-size:12px;text-align:center;"
           title="Font size in points"
           onmousedown="event.stopPropagation()"
           onkeydown="if(event.key==='Enter'){applyFontSize(this.value);this.blur();}"
           onchange="applyFontSize(this.value)"/>
  </div>
  <div class="rib-group" id="size-group" style="align-items:center;gap:4px;display:none;">
    <label style="font-size:11px;color:#555;">W</label>
    <input type="number" id="shape-w" min="0.1" max="100" step="0.1" placeholder="–"
           style="width:52px;border:1px solid #d0d0d0;border-radius:3px;padding:2px 4px;font-size:12px;text-align:center;"
           title="Box width in cm" onmousedown="event.stopPropagation()"
           onkeydown="if(event.key==='Enter'){applyShapeSize('w',this.value);this.blur();}"
           onchange="applyShapeSize('w',this.value)"/>
    <label style="font-size:11px;color:#555;">H</label>
    <input type="number" id="shape-h" min="0.1" max="100" step="0.1" placeholder="–"
           style="width:52px;border:1px solid #d0d0d0;border-radius:3px;padding:2px 4px;font-size:12px;text-align:center;"
           title="Box height in cm" onmousedown="event.stopPropagation()"
           onkeydown="if(event.key==='Enter'){applyShapeSize('h',this.value);this.blur();}"
           onchange="applyShapeSize('h',this.value)"/>
    <label style="font-size:9px;color:#aaa;">cm</label>
  </div>
  <div class="rib-zoom">
    <span id="zoom-label">100%</span>
    <input type="range" id="zoom-range" min="40" max="200" value="100" oninput="setZoom(this.value)"/>
  </div>
</div>

<!-- ═══════════════════════════════ WORKSPACE ════════════════════════════════ -->
<div id="workspace">
  <!-- Left: slide thumbnails -->
  <div id="slide-panel"></div>

  <!-- Center: editable canvas -->
  <div id="canvas-area" onclick="onCanvasAreaClick(event)">
    <div id="slide-wrapper"></div>
  </div>
</div>

<!-- ═══════════════════════════════ STATUS BAR ═══════════════════════════════ -->
<div id="statusbar">
  <span id="sb-slide">幻灯片 1 / 1</span>
  <span id="sb-shape"></span>
</div>

<!-- ═══════════════════════════════ FILE MANAGER MODAL ═══════════════════════ -->
<div class="modal-bg" id="filemgr-bg" onclick="closeFileMgr(event)">
  <div class="modal">
    <div class="modal-head">
      📋 已保存的演示文稿
      <button class="modal-close" onclick="closeFileMgr()">✕</button>
    </div>
    <div class="modal-body" id="filemgr-list"><em style="color:#888">加载中…</em></div>
    <div class="modal-foot">
      <button class="up-btn" style="font-size:13px;padding:6px 18px" onclick="closeFileMgr()">关闭</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ TOAST ════════════════════════════════════ -->
<div id="toast"></div>

<!-- ═══════════════════════════════ SCRIPT ═══════════════════════════════════ -->
<script>
"use strict";

/* ──────────────────────── State ──────────────────────── */
let _fid     = null;   // file id
let _meta    = null;   // full JSON from API
let _curIdx  = 0;      // current slide index
let _zoom    = 1.0;    // current zoom factor
let _selShape = null;  // currently selected shape div
let _lastFocusedRun = null; // {span, shape, pi, ri}
let _selectionSpans = [];   // run-spans in active selection (saved before focus change)
let _resizing = null;  // resize drag state
let _dragging = null;  // shape move drag state
const EMU_PER_PX = 9525; // 1 px = 9525 EMU at 96 dpi
const EMU_PER_CM = 360000; // 1 cm = 360000 EMU

/* ──────────────────────── Boot ─────────────────────── */
(function boot(){
  const m = location.pathname.match(/\/pptx-editor\/([a-zA-Z0-9_-]+)/);
  if(m){ _fid=m[1]; loadFile(_fid); }
})();

/* ──────────────────────── Upload ───────────────────── */
function onDragOver(e){ e.preventDefault(); document.getElementById('up-drop').classList.add('drag'); }
function onDragLeave(){ document.getElementById('up-drop').classList.remove('drag'); }
function onDrop(e){
  e.preventDefault();
  document.getElementById('up-drop').classList.remove('drag');
  if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
}
function onFilePick(e){ if(e.target.files[0]) upload(e.target.files[0]); e.target.value=''; }

async function upload(file){
  const ok=['.pptx','.pptm','.ppt'];
  if(!ok.includes(file.name.slice(file.name.lastIndexOf('.')).toLowerCase())){
    toast('只支持 .pptx / .pptm / .ppt',true); return;
  }
  toast('正在解析…');
  const fd=new FormData(); fd.append('file',file);
  try{
    const r=await fetch('/api/pptx/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok){toast(d.error||'上传失败',true);return;}
    _fid=d.id;
    history.replaceState({},'',`/pptx-editor/${_fid}`);
    await loadFile(_fid);
  }catch(e){toast('上传出错: '+e.message,true);}
}

/* ──────────────────────── Load ─────────────────────── */
async function loadFile(id){
  toast('正在加载…');
  try{
    const r=await fetch(`/api/pptx/${id}`);
    if(!r.ok){toast('文件不存在',true);return;}
    _meta=await r.json();
    _curIdx=0;
    showEditor();
    buildThumbs();
    renderSlide(_curIdx);
    toast(`已加载 ${_meta.slides.length} 页幻灯片`);
  }catch(e){toast('加载出错: '+e.message,true);}
}

/* ──────────────────────── Show editor chrome ────────── */
function showEditor(){
  document.getElementById('upload-screen').style.display='none';
  show('titlebar'); show('ribbon'); show('workspace'); show('statusbar');
  document.getElementById('tb-name').textContent=_meta.name||'演示文稿';
}
function show(id){
  const el=document.getElementById(id);
  el.style.display='flex';
}

/* ──────────────────────── Thumbnails ───────────────── */
function buildThumbs(){
  const panel=document.getElementById('slide-panel');
  panel.innerHTML='';
  const W=_meta.slideWidthEmu, H=_meta.slideHeightEmu;
  const THUMB_W=148;
  const THUMB_H=Math.round(THUMB_W*H/W);

  _meta.slides.forEach((slide,idx)=>{
    const wrap=document.createElement('div');
    wrap.className='slide-thumb'+(idx===_curIdx?' active':'');
    wrap.onclick=()=>selectSlide(idx);

    const cv=document.createElement('canvas');
    cv.width=THUMB_W; cv.height=THUMB_H;
    drawThumb(cv,slide,W,H);

    const num=document.createElement('div');
    num.className='slide-thumb-num'; num.textContent=idx+1;

    wrap.appendChild(cv); wrap.appendChild(num);
    panel.appendChild(wrap);
  });
}

function drawThumb(canvas,slide,slideW,slideH){
  const ctx=canvas.getContext('2d');
  const sw=canvas.width, sh=canvas.height;
  const scaleX=sw/slideW, scaleY=sh/slideH;

  // background
  ctx.fillStyle=slide.background||'#ffffff';
  ctx.fillRect(0,0,sw,sh);

  slide.shapes.forEach(shape=>{
    const x=shape.left*scaleX, y=shape.top*scaleY;
    const w=shape.width*scaleX, h=shape.height*scaleY;
    // fill
    if(shape.fill){
      ctx.fillStyle=shape.fill;
      ctx.fillRect(x,y,w,h);
    }
    // text (simplified)
    if(shape.has_text && shape.paragraphs){
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      let ty=y+3;
      shape.paragraphs.forEach(para=>{
        let lineText=(para.runs||[]).map(r=>r.text).join('');
        if(!lineText.trim()){ty+=6;return;}
        const firstRun=para.runs&&para.runs[0]||{};
        const ptSize=firstRun.size||14;
        const px=Math.max(ptSize*scaleY*0.85,5);
        ctx.font=`${firstRun.bold?'bold ':''}${px}px Segoe UI,sans-serif`;
        ctx.fillStyle='#222';
        ctx.fillText(lineText,x+3,ty+px);
        ty+=px*1.4;
      });
      ctx.restore();
    }
  });
}

/* ──────────────────────── Slide render ─────────────── */
function renderSlide(idx){
  _curIdx=idx;
  _selShape=null;
  _lastFocusedRun=null;
  _selectionSpans=[];

  // update thumbnail highlight
  document.querySelectorAll('.slide-thumb').forEach((el,i)=>{
    el.classList.toggle('active',i===idx);
  });

  const slide=_meta.slides[idx];
  const W=_meta.slideWidthEmu, H=_meta.slideHeightEmu;

  // Compute canvas pixel size based on zoom and available width
  const area=document.getElementById('canvas-area');
  const maxW=area.clientWidth-40;
  const baseW=Math.min(maxW, 960);
  const scale=(_zoom*baseW)/W;
  const pxW=Math.round(W*scale), pxH=Math.round(H*scale);

  const wrapper=document.getElementById('slide-wrapper');
  wrapper.style.width=pxW+'px';
  wrapper.style.height=pxH+'px';
  wrapper.style.background=slide.background||'#ffffff';
  wrapper.innerHTML='';

  // Render shapes
  slide.shapes.forEach(shape=>{
    const el=document.createElement('div');
    el.className='shape'+(shape.has_text?' has-text':'');
    el.dataset.shapeId=shape.id;
    el.style.left  =Math.round(shape.left  *scale)+'px';
    el.style.top   =Math.round(shape.top   *scale)+'px';
    el.style.width =Math.round(shape.width *scale)+'px';
    el.style.height=Math.round(shape.height*scale)+'px';

    if(shape.fill) el.style.background=shape.fill;

    if(shape.has_text && shape.paragraphs){
      const inner=document.createElement('div');
      inner.className='shape-inner';
      shape.paragraphs.forEach((para,pi)=>{
        const pEl=document.createElement('div');
        pEl.className='shape-para';
        pEl.style.textAlign=(para.align||'LEFT').toLowerCase();
        (para.runs||[]).forEach((run,ri)=>{
          const span=document.createElement('span');
          span.className='run-span';
          span.contentEditable='true';
          span.dataset.pi=pi; span.dataset.ri=ri;
          span.textContent=run.text;
          // Sizing: clamp rendered font to reasonable bounds
          const ptSize=run.size||14;
          span.style.fontSize=Math.round(ptSize*scale*1.33)+'px';
          if(run.bold)      span.style.fontWeight='bold';
          if(run.italic)    span.style.fontStyle='italic';
          if(run.underline) span.style.textDecoration='underline';
          if(run.color)     span.style.color=run.color;
          span.style.whiteSpace='pre-wrap';
          span.style.display='inline';
          // Events
          span.addEventListener('focus',()=>onRunFocus(el,shape,pi,ri));
          span.addEventListener('input',()=>onRunInput(span,shape,pi,ri));
          span.addEventListener('keydown', e=>{
            if(e.key==='Escape'){ span.blur(); return; }
            if((e.ctrlKey||e.metaKey)&&e.key==='a'){
              e.preventDefault();
              // Mark every run in this shape as "selected" for formatting
              _selectionSpans=Array.from(el.querySelectorAll('.run-span'));
            }
          });
          pEl.appendChild(span);
        });
        if((para.runs||[]).length===0){
          // Empty paragraph → spacer
          const br=document.createElement('br');
          pEl.appendChild(br);
        }
        inner.appendChild(pEl);
      });
      el.appendChild(inner);
    }

    // Handles (ALL shapes get resize handles)
    ['tl','tr','bl','br','tm','bm','ml','mr'].forEach(c=>{
      const h=document.createElement('div'); h.className='handle '+c;
      h.addEventListener('mousedown', ev=>{
        ev.stopPropagation(); ev.preventDefault();
        selectShape(el);
        startResize(ev, c, el, shape);
      });
      el.appendChild(h);
    });
    // Drag: only body clicks (not handles or text spans) start a move
    el.addEventListener('mousedown', e=>{
      if(e.target.classList.contains('handle')) return;
      if(e.target.classList.contains('run-span')) return;
      selectShape(el);
      startDrag(e, el, shape);
    });

    wrapper.appendChild(el);
  });

  // Update statusbar
  document.getElementById('sb-slide').textContent=`幻灯片 ${idx+1} / ${_meta.slides.length}`;
  document.getElementById('sb-shape').textContent='';
}

/* ──────────────────────── Shape selection ───────────── */
function selectShape(el){
  if(_selShape) _selShape.classList.remove('selected');
  _selShape=el;
  _selectionSpans=[];  // clear stale selection from any previous shape
  el.classList.add('selected');
  const shape=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(el.dataset.shapeId));
  if(shape){ document.getElementById('sb-shape').textContent=shape.name||''; updateSizeInputs(shape); }
}

function onCanvasAreaClick(e){
  const ca=document.getElementById('canvas-area');
  const sw=document.getElementById('slide-wrapper');
  if(e.target===ca||e.target===sw){
    if(_selShape){ _selShape.classList.remove('selected'); _selShape=null; }
    _lastFocusedRun=null;
    _selectionSpans=[];
    const inp=document.getElementById('font-size-input'); if(inp) inp.value='';
    updateSizeInputs(null);
  }
}

/* ──────────────────────── Editing ──────────────────── */
function onRunFocus(shapeEl, shape, pi, ri){
  selectShape(shapeEl);
  _lastFocusedRun = { span: shapeEl.querySelector(`[data-pi="${pi}"][data-ri="${ri}"]`), shape, pi, ri };
  const run = shape.paragraphs[pi] && shape.paragraphs[pi].runs[ri];
  const inp = document.getElementById('font-size-input');
  if(inp && run) inp.value = run.size || 14;
}

function onRunInput(span, shape, pi, ri){
  if(shape.paragraphs[pi] && shape.paragraphs[pi].runs[ri] !== undefined){
    shape.paragraphs[pi].runs[ri].text = span.textContent;
  }
  const shapeEl=span.closest('.shape');
  if(shapeEl) requestAnimationFrame(()=>autoFitShape(shapeEl,shape));
  scheduleThumbUpdate(_curIdx);
}

let _thumbTimer=null;
function scheduleThumbUpdate(idx){
  clearTimeout(_thumbTimer);
  _thumbTimer=setTimeout(()=>{
    const thumbs=document.querySelectorAll('.slide-thumb canvas');
    if(thumbs[idx]){
      const slide=_meta.slides[idx];
      drawThumb(thumbs[idx],slide,_meta.slideWidthEmu,_meta.slideHeightEmu);
    }
  },300);
}

/* ──────────────────────── Navigation ────────────────── */
function selectSlide(idx){ renderSlide(idx); }
function prevSlide(){ if(_curIdx>0) renderSlide(_curIdx-1); }
function nextSlide(){ if(_meta&&_curIdx<_meta.slides.length-1) renderSlide(_curIdx+1); }

/* ──────────────────────── Zoom ─────────────────────── */
function setZoom(v){
  _zoom=v/100;
  document.getElementById('zoom-label').textContent=v+'%';
  if(_meta) renderSlide(_curIdx);
}

/* ──────────────────────── Formatting ───────────────── */
function execFmt(cmd){
  const sel = window.getSelection();
  let targetSpans = [];

  // Prefer live selection, then saved selection, then last focused run
  if(sel && sel.rangeCount > 0 && !sel.isCollapsed){
    const range = sel.getRangeAt(0);
    document.querySelectorAll('.run-span').forEach(s=>{
      if(isSpanInSelection(s, range)) targetSpans.push(s);
    });
  }
  if(targetSpans.length === 0) targetSpans = _selectionSpans.slice();
  // If still nothing, apply to ALL runs in the selected shape
  if(targetSpans.length === 0 && _selShape)
    targetSpans = Array.from(_selShape.querySelectorAll('.run-span'));
  if(targetSpans.length === 0 && _lastFocusedRun && _lastFocusedRun.span)
    targetSpans = [_lastFocusedRun.span];
  if(targetSpans.length === 0) return;

  // Determine current state (toggle if all already have it)
  const allHave = targetSpans.every(s=>{
    const cs = window.getComputedStyle(s);
    if(cmd==='bold')      return cs.fontWeight==='700'||cs.fontWeight==='bold';
    if(cmd==='italic')    return cs.fontStyle==='italic';
    if(cmd==='underline') return cs.textDecoration.includes('underline');
    return false;
  });

  targetSpans.forEach(span=>{
    const pi=parseInt(span.dataset.pi), ri=parseInt(span.dataset.ri);
    const shapeEl=span.closest('.shape'); if(!shapeEl) return;
    const shape=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(shapeEl.dataset.shapeId));
    if(!shape||!shape.paragraphs[pi]||shape.paragraphs[pi].runs[ri]===undefined) return;
    const run=shape.paragraphs[pi].runs[ri];
    if(cmd==='bold'){      run.bold=!allHave;      span.style.fontWeight=run.bold?'bold':''; }
    if(cmd==='italic'){   run.italic=!allHave;    span.style.fontStyle=run.italic?'italic':''; }
    if(cmd==='underline'){run.underline=!allHave; span.style.textDecoration=run.underline?'underline':''; }
  });
  // Auto-fit shapes whose text layout may have changed
  const affectedEls=new Set(targetSpans.map(s=>s.closest('.shape')).filter(Boolean));
  requestAnimationFrame(()=>affectedEls.forEach(el=>{
    const sh=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(el.dataset.shapeId));
    if(sh) autoFitShape(el,sh);
  }));
  scheduleThumbUpdate(_curIdx);
}
function applyFontSize(val){
  const pt=parseFloat(val);
  if(isNaN(pt)||pt<1) return;
  const scale=getScale();
  let applied=false;

  // Use saved selection spans (survives focus change to input)
  if(_selectionSpans.length > 0){
    _selectionSpans.forEach(s=>{ updateRunSize(s,pt,scale); });
    applied=true;
  } else {
    const sel=window.getSelection();
    if(sel&&sel.rangeCount>0&&!sel.isCollapsed){
      const range=sel.getRangeAt(0);
      document.querySelectorAll('.run-span').forEach(s=>{
        if(isSpanInSelection(s,range)){ updateRunSize(s,pt,scale); applied=true; }
      });
    }
  }
  if(!applied&&_selShape){
    // No text specifically selected — apply to every run in the selected shape
    _selShape.querySelectorAll('.run-span').forEach(s=>{ updateRunSize(s,pt,scale); applied=true; });
  }
  if(!applied&&_lastFocusedRun&&_lastFocusedRun.span){
    updateRunSize(_lastFocusedRun.span,pt,scale);
  }
  if(applied) requestAnimationFrame(()=>{ if(_selShape){
    const sh=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(_selShape.dataset.shapeId));
    if(sh) autoFitShape(_selShape,sh);
  }});
  scheduleThumbUpdate(_curIdx);
}

function updateRunSize(span,pt,scale){
  const pi=parseInt(span.dataset.pi),ri=parseInt(span.dataset.ri);
  const shapeEl=span.closest('.shape'); if(!shapeEl) return;
  const shape=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(shapeEl.dataset.shapeId));
  if(!shape||!shape.paragraphs[pi]||shape.paragraphs[pi].runs[ri]===undefined) return;
  shape.paragraphs[pi].runs[ri].size=pt;
  span.style.fontSize=Math.round(pt*scale*1.33)+'px';
  requestAnimationFrame(()=>autoFitShape(shapeEl,shape));
}

function isSpanInSelection(span,range){
  try{
    const sr=document.createRange(); sr.selectNode(span);
    // Overlap: range.end > sr.start  AND  range.start < sr.end
    return range.compareBoundaryPoints(Range.END_TO_START,sr)>0 &&
           range.compareBoundaryPoints(Range.START_TO_END,sr)<0;
  }catch(e){ return false; }
}

/* ──────────────────────── Auto-fit & size UI ────────── */
function autoFitShape(shapeEl, shape){
  const inner=shapeEl.querySelector('.shape-inner');
  if(!inner) return;
  if(inner.scrollHeight > inner.clientHeight + 2){
    const newPx=inner.scrollHeight + 4;
    shapeEl.style.height=newPx+'px';
    const sc=getScale();
    shape.height=Math.round(newPx/sc);
    if(_selShape===shapeEl) updateSizeInputs(shape);
  }
}

function updateSizeInputs(shape){
  const grp=document.getElementById('size-group');
  const wIn=document.getElementById('shape-w');
  const hIn=document.getElementById('shape-h');
  if(!grp||!wIn||!hIn) return;
  if(shape){
    grp.style.display='flex';
    wIn.value=(shape.width /EMU_PER_CM).toFixed(1);
    hIn.value=(shape.height/EMU_PER_CM).toFixed(1);
  } else {
    grp.style.display='none';
    wIn.value=''; hIn.value='';
  }
}

function applyShapeSize(dim, val){
  const cm=parseFloat(val);
  if(isNaN(cm)||cm<0.1||!_selShape||!_meta) return;
  const shape=_meta.slides[_curIdx].shapes.find(s=>s.id===parseInt(_selShape.dataset.shapeId));
  if(!shape) return;
  const emu=Math.round(cm*EMU_PER_CM);
  const sc=getScale();
  if(dim==='w'){ shape.width =emu; _selShape.style.width =Math.round(emu*sc)+'px'; }
  else          { shape.height=emu; _selShape.style.height=Math.round(emu*sc)+'px'; }
  scheduleThumbUpdate(_curIdx);
}

/* ──────────────────────── Resize ────────────────────── */
function getScale(){
  const W=_meta.slideWidthEmu;
  const area=document.getElementById('canvas-area');
  const maxW=area.clientWidth-40;
  const baseW=Math.min(maxW,960);
  return (_zoom*baseW)/W;
}

function startResize(e, handle, shapeEl, shape){
  _resizing={
    handle, shapeEl, shape,
    startX:e.clientX, startY:e.clientY,
    startLeft:parseInt(shapeEl.style.left),
    startTop:parseInt(shapeEl.style.top),
    startW:parseInt(shapeEl.style.width),
    startH:parseInt(shapeEl.style.height),
  };
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('mouseup',stopResize);
}

function onResizeMove(e){
  if(!_resizing) return;
  const {handle,shapeEl,startX,startY,startLeft,startTop,startW,startH}=_resizing;
  const dx=e.clientX-startX, dy=e.clientY-startY;
  let l=startLeft,t=startTop,w=startW,h=startH;
  if(handle==='tl'||handle==='ml'||handle==='bl'){ w=Math.max(20,startW-dx); l=startLeft+startW-w; }
  if(handle==='tr'||handle==='mr'||handle==='br'){ w=Math.max(20,startW+dx); }
  if(handle==='tl'||handle==='tm'||handle==='tr'){ h=Math.max(10,startH-dy); t=startTop+startH-h; }
  if(handle==='bl'||handle==='bm'||handle==='br'){ h=Math.max(10,startH+dy); }
  shapeEl.style.left=l+'px'; shapeEl.style.top=t+'px';
  shapeEl.style.width=w+'px'; shapeEl.style.height=h+'px';
}

function stopResize(){
  if(!_resizing) return;
  const {shape,shapeEl}=_resizing;
  const sc=getScale();
  shape.left  =Math.round(parseInt(shapeEl.style.left)  /sc);
  shape.top   =Math.round(parseInt(shapeEl.style.top)   /sc);
  shape.width =Math.round(parseInt(shapeEl.style.width) /sc);
  shape.height=Math.round(parseInt(shapeEl.style.height)/sc);
  updateSizeInputs(shape);
  scheduleThumbUpdate(_curIdx);
  document.removeEventListener('mousemove',onResizeMove);
  document.removeEventListener('mouseup',stopResize);
  _resizing=null;
}

/* ──────────────────────── Drag / move ────────────────── */
function startDrag(e, shapeEl, shape){
  _dragging={
    shapeEl, shape, moved:false,
    startX:e.clientX, startY:e.clientY,
    startLeft:parseInt(shapeEl.style.left),
    startTop:parseInt(shapeEl.style.top),
  };
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('mouseup',stopDrag);
}

function onDragMove(e){
  if(!_dragging) return;
  const {shapeEl,startX,startY,startLeft,startTop}=_dragging;
  const dx=e.clientX-startX, dy=e.clientY-startY;
  if(!_dragging.moved && Math.abs(dx)<3 && Math.abs(dy)<3) return;
  _dragging.moved=true;
  shapeEl.style.left=(startLeft+dx)+'px';
  shapeEl.style.top =(startTop +dy)+'px';
}

function stopDrag(){
  if(!_dragging) return;
  if(_dragging.moved){
    const {shape,shapeEl}=_dragging;
    const sc=getScale();
    shape.left=Math.round(parseInt(shapeEl.style.left)/sc);
    shape.top =Math.round(parseInt(shapeEl.style.top) /sc);
    scheduleThumbUpdate(_curIdx);
  }
  document.removeEventListener('mousemove',onDragMove);
  document.removeEventListener('mouseup',stopDrag);
  _dragging=null;
}

/* ──────────────────────── Save ─────────────────────── */
async function doSave(){
  if(!_meta) return;
  toast('保存中…');
  try{
    const r=await fetch(`/api/pptx/${_fid}`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slides:_meta.slides}),
    });
    const d=await r.json();
    if(!r.ok){toast(d.error||'保存失败',true);return;}
    toast('✓ 已保存');
  }catch(e){toast('保存出错: '+e.message,true);}
}

/* ──────────────────────── Download ─────────────────── */
async function doDownload(){
  if(!_meta) return;
  await doSave();
  toast('正在生成文件…');
  try{
    const r=await fetch(`/api/pptx/${_fid}/download`);
    if(!r.ok){const d=await r.json().catch(()=>({}));toast(d.error||'下载失败',true);return;}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download=`${_meta.name||'presentation'}_edited.pptx`; a.click();
    URL.revokeObjectURL(url);
    toast('⬇ 下载开始');
  }catch(e){toast('下载出错: '+e.message,true);}
}

/* ──────────────────────── File manager ─────────────── */
async function openFileMgr(){
  document.getElementById('filemgr-bg').classList.add('show');
  const list=document.getElementById('filemgr-list');
  list.innerHTML='<em style="color:#888">加载中…</em>';
  try{
    const r=await fetch('/api/pptx/list'); const d=await r.json();
    if(d.files.length===0){list.innerHTML='<em style="color:#888">暂无已保存的文件</em>';return;}
    list.innerHTML=d.files.map(f=>`
      <div class="frow">
        <span class="frow-icon">📊</span>
        <span class="frow-name">${esc(f.name||f.originalFilename)}</span>
        <span class="frow-meta">${f.slideCount}页</span>
        <button class="frow-open" onclick="fmgrOpen('${f.id}')">打开</button>
        <button class="frow-del"  onclick="fmgrDel('${f.id}',this)">删除</button>
      </div>`).join('');
  }catch(e){list.innerHTML=`<em style="color:#a00">加载失败: ${esc(e.message)}</em>`;}
}
function closeFileMgr(e){
  if(!e||e.target===document.getElementById('filemgr-bg'))
    document.getElementById('filemgr-bg').classList.remove('show');
}
function fmgrOpen(id){
  closeFileMgr(); _fid=id;
  history.replaceState({},'',`/pptx-editor/${id}`);
  loadFile(id);
}
async function fmgrDel(id,btn){
  if(!confirm('确定删除此文件？')) return;
  const r=await fetch(`/api/pptx/${id}`,{method:'DELETE'});
  if(r.ok){ btn.closest('.frow').remove(); if(id===_fid){_meta=null; location.href='/pptx-editor/new';} }
  else toast('删除失败',true);
}

/* ──────────────────────── Toast ─────────────────────── */
let _tt=null;
function toast(msg,err=false){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show'+(err?' err':'');
  clearTimeout(_tt); _tt=setTimeout(()=>el.className='',2800);
}

/* ──────────────────────── Util ──────────────────────── */
function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ──────────────────────── Keyboard ─────────────────── */
document.addEventListener('keydown',e=>{
  if(e.target.classList.contains('run-span')) return; // don't steal from editing
  if(e.key==='ArrowLeft'||e.key==='PageUp')  prevSlide();
  if(e.key==='ArrowRight'||e.key==='PageDown') nextSlide();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); doSave(); }
});

/* ──────────────────────── Selection tracking ────────── */
// Save selected spans before focus moves away (e.g. to font-size input)
document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed) return;
  const range=sel.getRangeAt(0);
  const wrapper=document.getElementById('slide-wrapper');
  if(!wrapper) return;
  // Only track selections inside the slide
  try{ if(!wrapper.contains(range.commonAncestorContainer)) return; }catch(e){ return; }
  const found=[];
  document.querySelectorAll('.run-span').forEach(s=>{
    if(isSpanInSelection(s,range)) found.push(s);
  });
  if(found.length>0) _selectionSpans=found;
});

/* ──────────────────────── Resize ────────────────────── */
window.addEventListener('resize',()=>{ if(_meta) renderSlide(_curIdx); });
</script>
