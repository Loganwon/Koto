<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 社区 - Koto</title>
<link rel="stylesheet" href="/static/css/skill_community.css?v=20260326v6">
</head>
<body>
<div class="sc-page">

  <nav class="sc-nav">
    <div class="sc-brand">
      <span class="sc-logo">言</span>
      <span class="sc-title">Koto</span>
      <span class="sc-sep">/</span>
      <span class="sc-subtitle">Skill 社区</span>
    </div>
    <div class="sc-search-box">
      <span class="sc-search-icon">🔍</span>
      <input id="sc-search" type="text" placeholder="搜索技能…" autocomplete="off" spellcheck="false">
      <button id="sc-search-clear" class="sc-search-clear" title="清除">✕</button>
    </div>
    <div class="sc-nav-links">
      <a href="/skill-marketplace" class="sc-link-btn">📦 我的技能库</a>
      <a href="/" class="sc-link-btn">← 返回</a>
    </div>
  </nav>

  <div class="sc-body">
    <aside class="sc-sidebar">
      <div class="sc-stats">
        <div class="sc-stat"><span class="sc-stat-num" id="stat-total">-</span><span class="sc-stat-label">精选技能</span></div>
        <div class="sc-stat"><span class="sc-stat-num" id="stat-installed">-</span><span class="sc-stat-label">已安装</span></div>
      </div>

      <div class="sc-section">
        <div class="sc-section-title">分类</div>
        <div id="sc-cat-list" class="sc-cat-list"></div>
      </div>

      <div class="sc-section">
        <div class="sc-section-title">排序</div>
        <div id="sc-sort-list" class="sc-sort-list">
          <button class="sc-sort-btn active" data-sort="default">默认</button>
          <button class="sc-sort-btn" data-sort="name">名称 A→Z</button>
          <button class="sc-sort-btn" data-sort="installed">已安装优先</button>
        </div>
      </div>


    </aside>

    <main class="sc-main">

      <!-- ✨ AI 推荐 — 核心功能区 -->
      <div class="sc-ai-panel">
        <div class="sc-ai-panel-hd">
          <span class="sc-ai-panel-icon">✨</span>
          <div class="sc-ai-panel-title-wrap">
            <span class="sc-ai-panel-title">AI 智能推荐</span>
            <span class="sc-ai-panel-sub">描述你的需求，从 <strong>~500 个</strong>开源技能中精准匹配 &amp; 一键装入 Koto</span>
          </div>
        </div>
        <div class="sc-ai-panel-body">
          <textarea id="sc-ai-input" class="sc-ai-panel-textarea" placeholder="例：帮我写代码 review / 做产品分析 / 翻译英文论文…" rows="2"></textarea>
          <div class="sc-ai-panel-foot">
            <button id="sc-ai-btn" class="sc-ai-panel-btn">✨ 智能推荐</button>
            <span id="sc-ai-loading" class="sc-ai-loading" style="display:none">💡 AI 检索中…</span>
          </div>
        </div>
      </div>

      <div class="sc-toolbar">
        <span id="sc-count" class="sc-count">加载中…</span>
        <div class="sc-view-btns">
          <button id="sc-view-grid" class="sc-view-btn active" title="网格">⊞</button>
          <button id="sc-view-list" class="sc-view-btn" title="列表">☰</button>
        </div>
      </div>

      <div id="sc-ai-results" class="sc-ai-results" style="display:none">
        <div class="sc-ai-results-hdr">
          <span>✨ AI 推荐结果</span>
          <button id="sc-ai-close" class="sc-close-btn">✕ 关闭</button>
        </div>
        <div id="sc-ai-grid" class="sc-grid"></div>
        <hr class="sc-divider">
      </div>

      <div id="sc-grid" class="sc-grid"></div>
    </main>
  </div>
</div>

<!-- Detail Modal -->
<div class="sc-overlay" id="sc-overlay">
  <div class="sc-modal">
    <div class="sc-modal-head">
      <div class="sc-modal-icon" id="m-icon">🤖</div>
      <div class="sc-modal-info">
        <div class="sc-modal-name">
          <span id="m-name">技能名</span>
          <span class="sc-badge-ok" id="m-badge" style="display:none">✓ 已安装</span>
        </div>
        <div class="sc-modal-meta" id="m-meta"></div>
      </div>
      <button class="sc-modal-x" id="m-close">✕</button>
    </div>
    <div class="sc-modal-content">
      <p class="sc-modal-desc" id="m-desc"></p>
      <p class="sc-modal-src" id="m-src"></p>
      <div class="sc-modal-row">
        <div>
          <div class="sc-label">适用场景</div>
          <div class="sc-chips" id="m-cases"></div>
        </div>
        <div>
          <div class="sc-label">难度</div>
          <span class="sc-diff" id="m-diff"></span>
        </div>
      </div>
      <div>
        <div class="sc-label">标签</div>
        <div class="sc-modal-tags" id="m-tags"></div>
      </div>
      <div>
        <div class="sc-label sc-prompt-hdr" id="m-prompt-hdr">
          <span>Prompt 预览</span>
          <span class="sc-chevron" id="m-chevron">▼</span>
        </div>
        <div class="sc-prompt-body" id="m-prompt-body">
          <pre class="sc-prompt-pre" id="m-prompt"></pre>
        </div>
      </div>
    </div>
    <div class="sc-modal-foot">
      <button class="sc-btn sc-btn-install" id="m-install">⬇️ 安装到 Koto</button>
      <button class="sc-btn sc-btn-danger" id="m-uninstall" style="display:none">🗑️ 卸载</button>
      <span class="sc-modal-tip">安装后在「技能市场」中启用即可使用</span>
    </div>
  </div>
</div>

<div class="sc-toasts" id="sc-toasts"></div>

<script src="/static/js/skill_community.js?v=20260326v4"></script>
</body>
</html>
