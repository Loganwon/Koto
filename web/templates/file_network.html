<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件网络 - Koto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SF Pro Display', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .search-form .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-header h2 {
            font-size: 20px;
            color: #333;
        }

        .results-count {
            font-size: 14px;
            color: #666;
        }

        .file-list {
            display: grid;
            gap: 15px;
        }

        .file-card {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .file-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .file-type-docx {
            background: #dbeafe;
            color: #1e40af;
        }

        .file-type-pdf {
            background: #fee2e2;
            color: #991b1b;
        }

        .file-type-txt {
            background: #f3f4f6;
            color: #374151;
        }

        .file-path {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-family: 'Consolas', monospace;
        }

        .file-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .file-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-icon:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .processing-history {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .processing-history h4 {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            background: #f0f0f0;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .history-badge.annotate {
            background: #dcfce7;
            color: #166534;
        }

        .history-badge.edit {
            background: #dbeafe;
            color: #1e40af;
        }

        .history-badge.convert {
            background: #fef3c7;
            color: #92400e;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .network-view {
            margin-top: 20px;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            display: none;
        }

        .network-view.active {
            display: block;
        }

        .network-canvas {
            width: 100%;
            height: 400px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>
                <span>🌐</span>
                <span>文件网络</span>
            </h1>
            <p>快速查找、打开、追踪所有处理过的文件</p>

            <!-- 统计信息 -->
            <div class="stats-bar" id="statsBar">
                <div class="stat-card">
                    <div class="number" id="statTotalFiles">-</div>
                    <div class="label">总文件数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statTotalOperations">-</div>
                    <div class="label">处理次数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statTotalRelations">-</div>
                    <div class="label">文件关系</div>
                </div>
            </div>
        </div>

        <!-- 搜索面板 -->
        <div class="search-panel">
            <h2 style="margin-bottom: 20px; color: #333;">🔍 多维搜索</h2>
            <form class="search-form" id="searchForm">
                <div class="form-group full-width">
                    <label>🔎 文本搜索</label>
                    <input type="text" id="query" placeholder="搜索文件名、内容片段...">
                </div>
                <div class="form-group">
                    <label>📁 文件类型</label>
                    <select id="fileType">
                        <option value="">全部类型</option>
                        <option value="docx">Word (docx)</option>
                        <option value="pdf">PDF</option>
                        <option value="txt">文本 (txt)</option>
                        <option value="md">Markdown</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>⚙️ 处理操作</label>
                    <select id="operation">
                        <option value="">全部操作</option>
                        <option value="annotate">文档标注</option>
                        <option value="edit">编辑修改</option>
                        <option value="convert">格式转换</option>
                        <option value="cleanup">清理整理</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📅 开始日期</label>
                    <input type="date" id="dateFrom">
                </div>
                <div class="form-group">
                    <label>📅 结束日期</label>
                    <input type="date" id="dateTo">
                </div>
            </form>
            <div class="button-group">
                <button class="btn btn-primary" onclick="searchFiles()">
                    <span>🔍</span>
                    <span>搜索</span>
                </button>
                <button class="btn btn-secondary" onclick="resetSearch()">
                    <span>🔄</span>
                    <span>重置</span>
                </button>
                <button class="btn btn-secondary" onclick="loadStatistics()">
                    <span>📊</span>
                    <span>刷新统计</span>
                </button>
            </div>
        </div>

        <!-- 结果面板 -->
        <div class="results-panel">
            <div class="results-header">
                <h2>搜索结果</h2>
                <div class="results-count" id="resultsCount">准备搜索</div>
            </div>

            <!-- 文件列表 -->
            <div class="file-list" id="fileList">
                <div class="empty-state">
                    <div class="empty-state-icon">📂</div>
                    <p>输入搜索条件开始查找文件</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 加载统计信息
        async function loadStatistics() {
            try {
                const response = await fetch('/api/file-network/statistics');
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.statistics;
                    document.getElementById('statTotalFiles').textContent = stats.total_files || 0;
                    document.getElementById('statTotalOperations').textContent = stats.total_operations || 0;
                    document.getElementById('statTotalRelations').textContent = stats.total_relations || 0;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // 搜索文件
        async function searchFiles() {
            const query = document.getElementById('query').value.trim();
            const fileType = document.getElementById('fileType').value;
            const operation = document.getElementById('operation').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<div class="loading"><div class="spinner"></div><p>搜索中...</p></div>';

            try {
                const response = await fetch('/api/file-network/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        query: query || null,
                        file_type: fileType || null,
                        operation: operation || null,
                        date_from: dateFrom || null,
                        date_to: dateTo || null,
                        limit: 50
                    })
                });

                const result = await response.json();

                if (result.success) {
                    displayResults(result.results);
                    document.getElementById('resultsCount').textContent = 
                        `找到 ${result.total_count} 个文件`;
                } else {
                    fileList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>搜索失败: ${result.error}</p></div>`;
                }
            } catch (error) {
                console.error('搜索失败:', error);
                fileList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>网络错误，请重试</p></div>';
            }
        }

        // 显示结果
        function displayResults(files) {
            const fileList = document.getElementById('fileList');

            if (files.length === 0) {
                fileList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>未找到匹配的文件</p></div>';
                return;
            }

            fileList.innerHTML = files.map(file => {
                const typeClass = `file-type-${file.file_type || 'txt'}`;
                const history = file.processing_history || [];
                const operations = history.map(h => h.operation);

                return `
                    <div class="file-card" onclick="selectFile('${file.file_id}')">
                        <div class="file-card-header">
                            <div class="file-info">
                                <div class="file-name">
                                    <span>${file.name}</span>
                                    <span class="file-type-badge ${typeClass}">${file.file_type || 'txt'}</span>
                                </div>
                                <div class="file-path">${file.path}</div>
                                <div class="file-meta">
                                    <div class="file-meta-item">
                                        <span>📅</span>
                                        <span>${new Date(file.indexed_at).toLocaleString('zh-CN')}</span>
                                    </div>
                                    <div class="file-meta-item">
                                        <span>📊</span>
                                        <span>${(file.size / 1024).toFixed(1)} KB</span>
                                    </div>
                                    <div class="file-meta-item">
                                        <span>⚙️</span>
                                        <span>${file.processing_count || 0} 次处理</span>
                                    </div>
                                </div>
                            </div>
                            <div class="file-actions" onclick="event.stopPropagation()">
                                <button class="btn-icon" onclick="copyFilePath('${escapeJs(file.path || '')}')">
                                    <span>📋</span>
                                    <span>复制路径</span>
                                </button>
                                <button class="btn-icon" onclick="viewNetwork('${file.file_id}')">
                                    <span>🕸️</span>
                                    <span>关系</span>
                                </button>
                            </div>
                        </div>
                        ${history.length > 0 ? `
                            <div class="processing-history">
                                <h4>处理历史</h4>
                                <div class="history-list">
                                    ${history.slice(0, 5).map(h => `
                                        <div class="history-badge ${h.operation}">
                                            <span>${getOperationIcon(h.operation)}</span>
                                            <span>${getOperationName(h.operation)}</span>
                                            <span style="opacity: 0.7; font-size: 11px;">
                                                ${new Date(h.timestamp).toLocaleDateString('zh-CN')}
                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeJs(value) {
            return String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');
        }

        async function copyFilePath(path) {
            try {
                await navigator.clipboard.writeText(path);
                alert('✅ 路径已复制');
            } catch (error) {
                alert('请手动复制路径：\n' + path);
            }
        }

        // 查看文件关系网络（D3.js 力导向图）
        async function viewNetwork(fileId) {
            // 懒加载 D3
            if (!window.d3) {
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
                    s.onload = resolve; s.onerror = reject;
                    document.head.appendChild(s);
                });
            }
            // 拉取图数据
            let graphData;
            try {
                const res = await fetch(`/api/files/graph-data?center=${encodeURIComponent(fileId)}&limit=60`);
                graphData = await res.json();
            } catch(e) {
                alert('❌ 加载关系图失败: ' + e.message);
                return;
            }

            // 创建/复用模态框
            let modal = document.getElementById('networkModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'networkModal';
                modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;';
                modal.innerHTML = `
                  <div style="background:#fff;border-radius:16px;width:min(90vw,900px);height:min(85vh,680px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);">
                    <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;">
                      <div>
                        <b style="font-size:16px">🕸️ 文件关系图</b>
                        <span id="graphStats" style="margin-left:12px;font-size:12px;color:#888;"></span>
                      </div>
                      <div style="display:flex;gap:8px;align-items:center;font-size:12px;color:#666;">
                        <span>● <span style="color:#5568d3">同一任务</span></span>
                        <span>● <span style="color:#e55">重复文件</span></span>
                        <button onclick="document.getElementById('networkModal').remove()" style="margin-left:8px;border:none;background:#f5f5f5;padding:4px 12px;border-radius:6px;cursor:pointer;">关闭</button>
                      </div>
                    </div>
                    <svg id="networkSvg" style="flex:1;width:100%;"></svg>
                  </div>`;
                document.body.appendChild(modal);
                modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            }
            document.getElementById('graphStats').textContent =
                `${graphData.total_nodes} 个文件，${graphData.total_edges} 条关系`;

            // D3 渲染
            const svg = d3.select('#networkSvg');
            svg.selectAll('*').remove();
            const bbox = document.getElementById('networkSvg').getBoundingClientRect();
            const W = bbox.width || 860, H = bbox.height || 520;

            const catColor = {
                '文档':'#5568d3','图片':'#43aa8b','视频':'#f4a261',
                '音频':'#e76f51','代码':'#2a9d8f','压缩包':'#e9c46a','其他':'#aaa'
            };
            const edgeColor = { goal:'#5568d3', dup:'#e55555', recent:'#ccc' };

            const g = svg.append('g');
            svg.call(d3.zoom().scaleExtent([.3, 3])
                .on('zoom', e => g.attr('transform', e.transform)));

            const sim = d3.forceSimulation(graphData.nodes)
                .force('link', d3.forceLink(graphData.edges).id(d => d.id).distance(90))
                .force('charge', d3.forceManyBody().strength(-180))
                .force('center', d3.forceCenter(W / 2, H / 2))
                .force('collision', d3.forceCollide(28));

            const link = g.append('g').selectAll('line')
                .data(graphData.edges).join('line')
                .attr('stroke', d => edgeColor[d.type] || '#ccc')
                .attr('stroke-opacity', .7)
                .attr('stroke-width', d => d.type === 'dup' ? 2.5 : 1.5)
                .attr('stroke-dasharray', d => d.type === 'goal' ? '' : '5,3');

            const node = g.append('g').selectAll('g')
                .data(graphData.nodes).join('g')
                .call(d3.drag()
                    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

            node.append('circle')
                .attr('r', d => d.is_center ? 22 : 16)
                .attr('fill', d => catColor[d.category] || '#aaa')
                .attr('stroke', d => d.is_center ? '#333' : '#fff')
                .attr('stroke-width', d => d.is_center ? 3 : 2)
                .style('cursor', 'pointer');

            node.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .attr('fill', '#fff')
                .attr('font-size', 11)
                .attr('pointer-events', 'none')
                .text(d => (d.name || '').length > 8 ? d.name.slice(0, 7) + '…' : d.name);

            node.append('title').text(d => `${d.name}\n${d.path}\n${(d.size_bytes/1024).toFixed(1)} KB`);

            sim.on('tick', () => {
                link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        // 选择文件
        function selectFile(fileId) {
            console.log('选中文件:', fileId);
        }

        // 重置搜索
        function resetSearch() {
            document.getElementById('searchForm').reset();
            document.getElementById('fileList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📂</div><p>输入搜索条件开始查找文件</p></div>';
            document.getElementById('resultsCount').textContent = '准备搜索';
        }

        // 获取操作图标
        function getOperationIcon(operation) {
            const icons = {
                'annotate': '📝',
                'edit': '✏️',
                'convert': '🔄',
                'cleanup': '🧹'
            };
            return icons[operation] || '⚙️';
        }

        // 获取操作名称
        function getOperationName(operation) {
            const names = {
                'annotate': '标注',
                'edit': '编辑',
                'convert': '转换',
                'cleanup': '清理'
            };
            return names[operation] || operation;
        }

        // 页面加载时加载统计
        window.addEventListener('load', () => {
            loadStatistics();
        });

        // 回车搜索
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchFiles();
            }
        });
    </script>
</body>
</html>
