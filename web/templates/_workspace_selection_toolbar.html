<div
  id="wa-pdf-tooltip"
  class="wa-sel-toolbar"
  style="display:none"
  {% if wa_pdf_tooltip_root_onmousedown %}onmousedown="{{ wa_pdf_tooltip_root_onmousedown }}"{% endif %}
>
  <button type="button" class="wa-sel-close" onclick="WA.closeSelectionToolbar()" title="关闭" aria-label="关闭">×</button>
  <span id="wa-tooltip-count" class="wa-sel-count">0字</span>
  <span class="wa-sel-divider" aria-hidden="true"></span>
  <button type="button" class="wa-sel-action wa-sel-ai-action" onclick="WA.sendQuickAction('润色')" title="润色选中文字">润色</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" onclick="WA.sendQuickAction('翻译')" title="翻译选中文字">翻译</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" onclick="WA.sendQuickAction('解释')" title="解释选中文字">解释</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" onclick="WA.sendQuickAction('可视化')" title="将选区生成图表">可视化</button>
  <button type="button" class="wa-sel-action" onclick="WA.sendSelectionToAI()" title="加入上下文">加入上下文</button>
  {% if wa_pdf_tooltip_show_pdf_annotation_actions %}
  <span id="wa-tooltip-annot-sep" class="wa-sel-divider" aria-hidden="true"></span>
  <button id="wa-tooltip-highlight" type="button" class="wa-sel-action" onclick="WA.pdfAnnotateSelection('highlight')" title="高亮选区">高亮</button>
  <button id="wa-tooltip-underline" type="button" class="wa-sel-action" onclick="WA.pdfAnnotateSelection('underline')" title="下划线选区">下划线</button>
  {% else %}
  <span id="wa-tooltip-annot-sep" class="wa-sel-divider" style="display:none" aria-hidden="true"></span>
  <button id="wa-tooltip-highlight" type="button" class="wa-sel-action" style="display:none" onclick="WA.pdfAnnotateSelection('highlight')" title="高亮选区">高亮</button>
  <button id="wa-tooltip-underline" type="button" class="wa-sel-action" style="display:none" onclick="WA.pdfAnnotateSelection('underline')" title="下划线选区">下划线</button>
  {% endif %}
</div>
