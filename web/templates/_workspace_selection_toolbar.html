<div
  id="wa-selection-toolbar"
  class="wa-sel-toolbar"
  style="display:none"
  data-koto-event-mousedown="h_prevent_default"
>
  <button type="button" class="wa-sel-close" data-koto-event-mousedown="h_prevent_default" data-koto-event-click="h_selection_close" title="关闭" aria-label="关闭">×</button>
  <span id="wa-tooltip-count" class="wa-sel-count">0字</span>
  <span class="wa-sel-divider" aria-hidden="true"></span>
  <button type="button" class="wa-sel-action wa-sel-ai-action" data-koto-event-mousedown="h_prevent_default" data-quick-action="润色" data-koto-event-click="h_selection_quick_action" title="润色选中文字">润色</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" data-koto-event-mousedown="h_prevent_default" data-quick-action="翻译" data-koto-event-click="h_selection_quick_action" title="翻译选中文字">翻译</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" data-koto-event-mousedown="h_prevent_default" data-quick-action="解释" data-koto-event-click="h_selection_quick_action" title="解释选中文字">解释</button>
  <button type="button" class="wa-sel-action wa-sel-ai-action" data-koto-event-mousedown="h_prevent_default" data-quick-action="可视化" data-koto-event-click="h_selection_quick_action" title="将选区生成图表">可视化</button>
  <button type="button" class="wa-sel-action" data-koto-event-mousedown="h_prevent_default" data-koto-event-click="h_selection_send_to_ai" title="加入上下文">加入上下文</button>
  <span class="wa-sel-divider wa-pdf-annot-sep{% if not wa_pdf_tooltip_show_pdf_annotation_actions %} wa-hidden{% endif %}" aria-hidden="true"></span>
  <button class="wa-sel-action wa-pdf-annot-btn{% if not wa_pdf_tooltip_show_pdf_annotation_actions %} wa-hidden{% endif %}" type="button" data-koto-event-mousedown="h_prevent_default" data-pdf-annotation="highlight" data-koto-event-click="h_selection_pdf_annotate" title="高亮选区">高亮</button>
  <button class="wa-sel-action wa-pdf-annot-btn{% if not wa_pdf_tooltip_show_pdf_annotation_actions %} wa-hidden{% endif %}" type="button" data-koto-event-mousedown="h_prevent_default" data-pdf-annotation="underline" data-koto-event-click="h_selection_pdf_annotate" title="下划线选区">下划线</button>
</div>
