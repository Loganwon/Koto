<div class="wa-model-mode-toggle wa-footer-model-mode-select wa-model-mode-toggle-compact" role="group" aria-label="AI 模型选择">
  <button type="button" class="wa-model-mode-toggle-btn active" data-model-mode="deepseek" onclick="(function(mode){try{if(window.WA&&typeof window.WA.setLockedModel==='function'){window.WA.setLockedModel(mode);}}catch(_){}var normalized=['deepseek','local'].indexOf(mode)>=0?mode:'deepseek';try{localStorage.setItem('wa_locked_model',normalized);localStorage.setItem('wa_model_choice_explicit','1');}catch(_){}document.querySelectorAll('.wa-model-mode-toggle-btn[data-model-mode]').forEach(function(button){button.classList.toggle('active',button.dataset.modelMode===normalized);});try{var meta=document.querySelector('meta[name=&quot;csrf-token&quot;]');var token=meta?String(meta.getAttribute('content')||''):'';fetch('/api/local-model/switch',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{'X-CSRFToken':token}:{}),body:JSON.stringify({mode:normalized})}).catch(function(){});}catch(_){}})('deepseek')" title="DeepSeek 云端模型">
    <span class="wa-model-mode-main">DeepSeek</span>
    <span class="wa-model-mode-sub">V4 Pro</span>
  </button>
  <button type="button" class="wa-model-mode-toggle-btn" data-model-mode="local" onclick="(function(mode){try{if(window.WA&&typeof window.WA.setLockedModel==='function'){window.WA.setLockedModel(mode);}}catch(_){}var normalized=['deepseek','local'].indexOf(mode)>=0?mode:'deepseek';try{localStorage.setItem('wa_locked_model',normalized);localStorage.setItem('wa_model_choice_explicit','1');}catch(_){}document.querySelectorAll('.wa-model-mode-toggle-btn[data-model-mode]').forEach(function(button){button.classList.toggle('active',button.dataset.modelMode===normalized);});try{var meta=document.querySelector('meta[name=&quot;csrf-token&quot;]');var token=meta?String(meta.getAttribute('content')||''):'';fetch('/api/local-model/switch',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{'X-CSRFToken':token}:{}),body:JSON.stringify({mode:normalized})}).catch(function(){});}catch(_){}})('local')" title="本地模型">
    <span class="wa-model-mode-main">本地</span>
    <span class="wa-model-mode-sub">未启动</span>
  </button>
</div>
