<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koto 文件助手</title>
  <!-- socket.io CDN 兜底（npm 安装后可删除） -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="file-assistant-root">
    <!-- 左侧：文件导航 -->
    <aside id="left-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">文件列表</span>
      </div>
      <div id="file-tree" class="file-tree">
        <div class="file-tree-empty">暂无文件，点击下方新建</div>
      </div>
      <div class="sidebar-footer">
        <button id="btn-new-doc" class="sidebar-btn">+ 新建文档</button>
      </div>
    </aside>

    <!-- 中央：Univer Canvas 文档编辑器 -->
    <main id="center-doc">
      <div id="univer-container"></div>
    </main>

    <!-- 右侧：AI 助手面板 -->
    <aside id="right-ai-panel"></aside>

    <!-- 技能执行面板（底部弹出，由 AIPanel._activateSkill 控制） -->
    <div id="skill-exec-panel" class="skill-exec-panel collapsed">
      <div class="skill-exec-header">
        <span class="skill-exec-title">🔧 技能执行</span>
        <div class="skill-exec-header-btns">
          <button class="skill-exec-minimize" title="最小化/展开">▼</button>
          <button class="skill-exec-close" title="关闭">✕</button>
        </div>
      </div>
      <div class="skill-exec-body"></div>
    </div>
  </div>

  <!-- 技能执行面板：绑定最小化/关闭按钮 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var panel = document.getElementById('skill-exec-panel');
      if (!panel) return;
      panel.querySelector('.skill-exec-minimize').addEventListener('click', function () {
        panel.classList.toggle('minimized');
      });
      panel.querySelector('.skill-exec-close').addEventListener('click', function () {
        panel.classList.add('collapsed');
      });
    });
  </script>

  <script type="module" src="./main.js"></script>
  <!-- 自动激活文档：等待 FileManager 就绪后，自动加载最近的文档 -->
  <script>
    (function autoActivateDoc() {
      var attempts = 0;
      var timer = setInterval(function () {
        attempts++;
        var fm = window.__koto && window.__koto.fileManager;
        if (!fm) { if (attempts > 40) clearInterval(timer); return; }
        clearInterval(timer);
        if (fm._activeId) return;
        if (fm._files && fm._files.length > 0) {
          fm._switchDoc(fm._files[0].id);
        } else {
          fetch('/api/editor/docs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: '快速笔记' })
          }).then(function (r) { return r.json(); }).then(function (d) {
            if (d.id) { fm._activeId = d.id; fm.refresh && fm.refresh(); }
          }).catch(function () {});
        }
      }, 300);
    })();
  </script>
</body>
</html>
