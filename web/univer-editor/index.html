<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koto 文件助手</title>
  <!-- socket.io CDN 兜底（npm 安装后可删除） -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="file-assistant-root">
    <!-- 左侧：文件导航 -->
    <aside id="left-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">文件列表</span>
      </div>
      <div id="file-tree" class="file-tree">
        <div class="file-tree-empty">暂无文件，点击下方新建</div>
      </div>
      <div class="sidebar-footer">
        <button id="btn-new-doc" class="sidebar-btn">+ 新建文档</button>
      </div>
    </aside>

    <!-- 中央：Univer Canvas 文档编辑器 -->
    <main id="center-doc">
      <div id="univer-container"></div>
    </main>

    <!-- 右侧：AI 助手面板 -->
    <aside id="right-ai-panel"></aside>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
