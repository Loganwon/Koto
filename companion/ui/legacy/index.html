<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koto</title>
<link rel="stylesheet" href="style.css?v=20261019.4"><script src="history.js?v=20261019.4" defer></script><script src="app.js" defer></script>
</head><body data-view="chat" data-files-open="false">
<header class="topbar"><button id="files-toggle" class="panel-toggle" title="在左侧展开文件栏，对话保持可用" aria-label="文件" aria-controls="files-pane" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">☷</span> 文件<span id="files-count" hidden></span></button><strong class="brand">Koto</strong><span class="spacer"></span><button id="history-toggle" title="查找这份文档的历史对话" aria-controls="history-tools" aria-expanded="false">历史</button><button id="new-task" class="icon-button" title="新任务，使用当前选区" aria-label="新任务">＋</button><button id="api-status" title="模型设置">设置</button></header>
<p id="connection-notice" role="status" hidden></p>
<p id="recovery-notice" role="status" hidden></p>
<div class="workspace">
<aside id="files-pane" hidden aria-label="工作文件">
<div class="files-heading"><strong>工作文件</strong><button id="files-close" title="收起文件列表" aria-label="收起文件列表">‹</button></div>
<div class="folder-actions"><button id="choose-folder" class="folder-picker">打开文件夹…</button><button id="refresh-files" title="刷新文件列表" aria-label="刷新文件列表">↻</button></div>
<input id="file-filter" type="search" placeholder="搜索文件" aria-label="搜索文件" autocomplete="off">
<button id="tree-name" aria-expanded="true"></button><div id="file-tree" role="tree" aria-label="工作文件夹"></div><p id="tree-note">打开文件夹，选择需要引用的资料</p><p id="files-error" role="alert" hidden></p><div class="files-footer"><span id="files-selection-summary" role="status">点选即可引用</span><button id="clear-files" hidden>清空</button></div>
</aside>
<div id="files-resizer" role="separator" tabindex="0" aria-label="调整文件栏宽度" aria-orientation="vertical" aria-controls="files-pane" hidden></div>
<div class="assistant" aria-label="AI 助手">
<section class="context" aria-label="当前文档"><div class="document-row"><span class="file-symbol">▤</span><strong id="target-name">打开 Office / WPS 文件</strong><span id="save-state"></span></div><details id="source-preview" hidden><summary id="selection-hint">选中文字，再提要求</summary><div class="context-popover"><div class="preview-heading"><span id="scope"></span><button id="connect" title="重新读取选区" aria-label="重新读取当前选区">↻</button></div><div id="target-path" hidden></div><div id="source-text"></div><div id="table-preview"></div><p id="context-limit" hidden></p></div></details><p id="selection-empty">选中文字，再提要求</p></section>
<section id="history-tools" hidden aria-label="查找历史对话"><div class="history-search"><input id="history-query" type="search" placeholder="搜索这份文档的对话" aria-label="搜索历史对话"><button id="history-close" aria-label="收起历史搜索">×</button></div><div class="history-meta"><span id="history-summary" role="status"></span><button id="history-clear" hidden>清除搜索</button></div><div id="history-results"></div><button id="more-matches" hidden>更多匹配记录</button><p id="history-error" hidden role="alert"></p></section>
<main id="conversation" aria-label="对话"><button id="load-earlier" hidden>加载更早的对话</button><section id="recent-turns" aria-label="历史消息"></section><p id="welcome" hidden>选中文字，直接提要求。</p><div id="task-request" class="user-message" hidden></div><section id="task-status" hidden><div class="status-line"><span class="busy-dot" aria-hidden="true"></span><span id="phase-label" class="sr-only"></span><span id="message" role="status" aria-live="polite"></span><span id="progress"></span><button id="stop" hidden>停止</button></div><p id="pinned-target" hidden></p></section><section id="answer" hidden aria-label="回答"></section>
<section id="review" hidden aria-label="已完成的修改"><div class="review-heading"><strong id="review-title"></strong><button id="locate" title="在文档中定位改动">定位 ↗</button></div><p id="after-visible" aria-label="原生文档中已写入的文字"></p><p id="edit-note" hidden></p><details class="diff"><summary>查看完整改动</summary><small>修改前</small><p id="before"></p><small>修改后</small><p id="after"></p></details></section>
<p id="sources" hidden></p><p id="artifact-receipt" hidden><span id="artifact-name"></span><button id="open-artifact">打开 ↗</button></p><div id="feedback-panel" hidden><button id="continue" class="primary">下一处 →</button><button id="focus-feedback">调整这一处</button></div><p id="error" role="alert" hidden></p><button id="retry" hidden>重试这一步</button></main>
<section class="composer" aria-label="输入要求"><button id="jump-latest" hidden>↓ 回到最新消息</button><div id="reference-chips" aria-label="待引用文件" hidden></div><div class="input-box"><label class="sr-only" for="instruction">你的要求或反馈</label><textarea id="instruction" rows="2" placeholder="选中文字，告诉 Koto 怎么改…"></textarea><div class="input-bottom"><button id="attach-files" title="引用工作文件" aria-label="引用文件">＋ 文件</button><span id="composer-note">Enter 发送</span><span id="send-scope" class="sr-only"></span><button id="start" class="primary" disabled title="发送，Enter">↑</button></div></div></section>
</div></div>
<dialog id="settings-dialog"><div class="dialog-heading"><strong>模型设置</strong><button id="close-settings" aria-label="关闭设置">×</button></div><p id="connection-summary"></p><div class="settings"><label for="host">跟随应用</label><div class="follow-controls"><select id="host"><option value="auto">自动跟随</option><option value="word">Word</option><option value="wps">WPS 文字</option><option value="excel">Excel</option><option value="powerpoint">PowerPoint</option></select><button id="watch-toggle">Ⅱ</button><span id="follow-status">自动跟随</span></div><p id="activity"></p><label for="base-url">API 地址</label><input id="base-url" type="url" autocomplete="off"><label for="model">模型名称</label><input id="model" autocomplete="off"><label for="api-key">API 密钥</label><input id="api-key" type="password" autocomplete="off" placeholder="留空继续使用当前密钥"><button id="save-settings" class="primary">保存本次设置</button><p class="hint">密钥仅本次运行有效。发送时按需读取文档与引用文件。</p><p id="settings-error" role="alert" hidden></p></div></dialog>
<template id="interface-settings"><div class="interface-settings"><span>界面 20261019.4</span><button id="reload-interface">重新加载界面</button></div><p class="hint">刷新会结束当前编辑任务，已完成的交流与草稿保留。</p></template>
</body></html>
